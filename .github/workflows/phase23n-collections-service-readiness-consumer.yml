name: Phase 23N Collections Service Readiness Consumer

on:
  push:
    branches: [main, 'phase/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase23n-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php }}
  cancel-in-progress: true

jobs:
  service-readiness-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\nactual_sha=%s\nrun_id=%s\nphp=%s\n' "$EXPECTED_SHA" "$actual_sha" "$GITHUB_RUN_ID" "${{ matrix.php }}" > "qa-evidence/phase23n-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify readiness-consumer files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            includes/interface-spdb-collections-repository.php
            includes/interface-spdb-native-reference-resolver.php
            includes/interface-spdb-native-reference-readiness.php
            includes/class-spdb-collections-service-readiness-gate.php
            includes/class-spdb-collections-service-readiness-integration.php
            includes/class-spdb-collections-repository-readiness-probe.php
            includes/class-spdb-collections-service-probe-binding.php
            includes/class-spdb-collections-service-readiness-consumer.php
            includes/class-spdb-collections-service.php
            includes/class-spdb-plugin.php
            tests/phase23h-readiness-bridge-tests.php
            tests/phase23i-registry-readiness-tests.php
            tests/phase23j-collections-service-readiness-tests.php
            tests/phase23k-collections-service-readiness-integration-tests.php
            tests/phase23l-collections-repository-readiness-probe-tests.php
            tests/phase23m-collections-service-probe-binding-tests.php
            tests/phase23n-collections-service-readiness-consumer-tests.php
            tests/phase23n-consumer-adversarial-tests.php
            tests/phase23o-collections-service-internal-consumption-tests.php
            tests/architecture-guard.php
          )
          for file in "${required[@]}"; do test -s "$file" || exit 1; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            includes/class-spdb-collections-service-readiness-consumer.php \
            includes/class-spdb-collections-service.php \
            includes/class-spdb-plugin.php \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/phase23o-collections-service-internal-consumption-tests.php \
            tests/architecture-guard.php
          do php -l "$file"; done

      - name: Run consumer and inherited readiness regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/phase23m-collections-service-probe-binding-tests.php \
            tests/phase23l-collections-repository-readiness-probe-tests.php \
            tests/phase23k-collections-service-readiness-integration-tests.php \
            tests/phase23j-collections-service-readiness-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            tests/phase23h-readiness-bridge-tests.php \
            tests/phase23o-collections-service-internal-consumption-tests.php \
            tests/architecture-guard.php
          do
            php -d display_errors=1 -d error_reporting=E_ALL "$suite" \
              | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"
          done

      - name: Verify bounded consumer and canonical runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $consumer = file_get_contents( 'includes/class-spdb-collections-service-readiness-consumer.php' );
          $service  = file_get_contents( 'includes/class-spdb-collections-service.php' );
          $plugin   = file_get_contents( 'includes/class-spdb-plugin.php' );
          $fail = static function ( string $message ): void {
              file_put_contents( 'php://stderr', "STATIC GUARD FAIL: {$message}\n" );
              exit( 1 );
          };
          foreach ( array(
              'final class SPDB_Collections_Service_Readiness_Consumer',
              'HEALTH_KEYS',
              'REPOSITORY_HEALTH_KEYS',
              'private function __construct',
              'private function __clone',
              'public function __serialize',
              'public function __unserialize',
              'public static function create',
              'new SPDB_Collections_Service_Readiness_Gate',
              'new SPDB_Collections_Service_Readiness_Integration',
              'new SPDB_Collections_Repository_Readiness_Probe',
              'public function health',
              'public function require_read_ready',
              'public function require_write_ready',
              'valid_health_projection',
              'valid_schema_version',
          ) as $needle ) {
              if ( false === strpos( $consumer, $needle ) ) { $fail( "Missing consumer control: {$needle}" ); }
          }
          foreach ( array( 'function probe(', 'function repository(', 'function resolver(', 'set_probe', 'set_repository', 'set_resolver', 'set_integration' ) as $forbidden ) {
              if ( false !== strpos( $consumer, $forbidden ) ) { $fail( "Raw dependency exposure present: {$forbidden}" ); }
          }
          foreach ( array(
              'register_rest_route(', 'WP_REST_Server::CREATABLE', 'WP_REST_Server::EDITABLE', 'WP_REST_Server::DELETABLE',
              'wp_insert_post(', 'wp_update_post(', 'wp_delete_post(', 'update_option(', 'update_user_meta(', 'update_post_meta(',
              'file_put_contents(', 'fopen(', 'fwrite(', '->insert(', '->update(', '->delete(', '->query(', '->resolve_reference('
          ) as $forbidden ) {
              if ( false !== strpos( $consumer, $forbidden ) ) { $fail( "Forbidden consumer operation: {$forbidden}" ); }
          }
          if ( false === strpos( $service, 'SPDB_Collections_Service_Readiness_Consumer::create( $repository, $resolver )' ) ) {
              $fail( 'Service-side consumer integration is missing.' );
          }
          if ( false === strpos( $plugin, 'new SPDB_Collections_Service( $this->collections_repository, $this->native_reference_registry )' ) ) {
              $fail( 'Plugin does not inject the reviewed native-reference registry.' );
          }
          echo "Phase 23N bounded consumer and Phase 23O runtime wiring passed.\n";
          PHP

      - name: Record exact-source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/phase23n-collections-service-readiness-consumer.yml \
            includes/class-spdb-collections-service-readiness-consumer.php \
            includes/class-spdb-collections-service.php \
            includes/class-spdb-plugin.php \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/phase23o-collections-service-internal-consumption-tests.php \
            tests/architecture-guard.php \
            > "qa-evidence/phase23n-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23N QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23n-service-readiness-consumer-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
