name: Phase 23N Collections Service Readiness Consumer

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase23n-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service-readiness-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and stacked ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          if [ -n "$EXPECTED_BASE_SHA" ]; then
            git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
            git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_SHA"
          fi
          printf 'expected_sha=%s\nactual_sha=%s\nexpected_base_sha=%s\nrun_id=%s\nphp=%s\n' \
            "$EXPECTED_SHA" "$actual_sha" "$EXPECTED_BASE_SHA" "$GITHUB_RUN_ID" "${{ matrix.php }}" \
            > "qa-evidence/phase23n-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify Phase 23N files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .github/workflows/phase23n-collections-service-readiness-consumer.yml
            docs/AUDIT-PHASE-23N-COLLECTIONS-SERVICE-READINESS-CONSUMER-2026-07-31.md
            includes/interface-spdb-collections-repository.php
            includes/interface-spdb-native-reference-resolver.php
            includes/interface-spdb-native-reference-readiness.php
            includes/class-spdb-collections-service-readiness-gate.php
            includes/class-spdb-collections-service-readiness-integration.php
            includes/class-spdb-collections-repository-readiness-probe.php
            includes/class-spdb-collections-service-probe-binding.php
            includes/class-spdb-collections-service-readiness-consumer.php
            includes/class-spdb-collections-service.php
            includes/class-spdb-plugin.php
            tests/phase23h-readiness-bridge-tests.php
            tests/phase23i-registry-readiness-tests.php
            tests/phase23j-collections-service-readiness-tests.php
            tests/phase23k-collections-service-readiness-integration-tests.php
            tests/phase23l-collections-repository-readiness-probe-tests.php
            tests/phase23m-collections-service-probe-binding-tests.php
            tests/phase23n-collections-service-readiness-consumer-tests.php
            tests/phase23n-consumer-adversarial-tests.php
            tests/architecture-guard.php
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/interface-spdb-collections-repository.php
          php -l includes/interface-spdb-native-reference-resolver.php
          php -l includes/interface-spdb-native-reference-readiness.php
          php -l includes/class-spdb-collections-service-readiness-gate.php
          php -l includes/class-spdb-collections-service-readiness-integration.php
          php -l includes/class-spdb-collections-repository-readiness-probe.php
          php -l includes/class-spdb-collections-service-probe-binding.php
          php -l includes/class-spdb-collections-service-readiness-consumer.php
          php -l includes/class-spdb-collections-service.php
          php -l includes/class-spdb-plugin.php
          php -l tests/phase23h-readiness-bridge-tests.php
          php -l tests/phase23i-registry-readiness-tests.php
          php -l tests/phase23j-collections-service-readiness-tests.php
          php -l tests/phase23k-collections-service-readiness-integration-tests.php
          php -l tests/phase23l-collections-repository-readiness-probe-tests.php
          php -l tests/phase23m-collections-service-probe-binding-tests.php
          php -l tests/phase23n-collections-service-readiness-consumer-tests.php
          php -l tests/phase23n-consumer-adversarial-tests.php
          php -l tests/architecture-guard.php

      - name: Run Phase 23N primary consumer tests
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23n-collections-service-readiness-consumer-tests.php \
            | tee "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23N adversarial consumer tests
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23n-consumer-adversarial-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23M binding regression
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23m-collections-service-probe-binding-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23L probe regression
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23l-collections-repository-readiness-probe-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23K integration regression
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23k-collections-service-readiness-integration-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23J gate regression
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23j-collections-service-readiness-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23I conformance regression
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23i-registry-readiness-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23H bridge regression
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/phase23h-readiness-bridge-tests.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Run architecture guard
        shell: bash
        run: |
          set -o pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/architecture-guard.php \
            | tee -a "qa-evidence/phase23n-tests-php-${{ matrix.php }}.log"

      - name: Verify bounded consumer and no runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $source = file_get_contents( 'includes/class-spdb-collections-service-readiness-consumer.php' );
          $service = file_get_contents( 'includes/class-spdb-collections-service.php' );
          $plugin = file_get_contents( 'includes/class-spdb-plugin.php' );
          $primary = file_get_contents( 'tests/phase23n-collections-service-readiness-consumer-tests.php' );
          $adversarial = file_get_contents( 'tests/phase23n-consumer-adversarial-tests.php' );
          $audit = file_get_contents( 'docs/AUDIT-PHASE-23N-COLLECTIONS-SERVICE-READINESS-CONSUMER-2026-07-31.md' );
          $fail = static function ( string $message ): void {
              file_put_contents( 'php://stderr', "STATIC GUARD FAIL: {$message}\n" );
              exit( 1 );
          };
          foreach ( array(
              'final class SPDB_Collections_Service_Readiness_Consumer',
              'MAX_CODE_LENGTH',
              'HEALTH_KEYS',
              'REPOSITORY_HEALTH_KEYS',
              'private function __construct',
              'private function __clone',
              'public function __serialize',
              'public function __unserialize',
              'public static function create',
              'new SPDB_Collections_Service_Readiness_Gate',
              'new SPDB_Collections_Service_Readiness_Integration',
              'new SPDB_Collections_Repository_Readiness_Probe',
              'resolver_available',
              'public function health',
              'public function require_read_ready',
              'public function require_write_ready',
              'valid_health_projection',
              'valid_schema_version',
              'current_schema_version',
              'service_readiness_projection_invalid',
          ) as $needle ) {
              if ( false === strpos( $source, $needle ) ) { $fail( "Missing consumer control: {$needle}" ); }
          }
          foreach ( array( 'function probe(', 'function service(', 'function repository(', 'function resolver(', 'set_probe', 'set_repository', 'set_resolver', 'set_integration' ) as $forbidden ) {
              if ( false !== strpos( $source, $forbidden ) ) { $fail( "Raw dependency exposure or replacement present: {$forbidden}" ); }
          }
          if ( false !== strpos( $plugin, 'class-spdb-collections-service-readiness-consumer.php' ) ) {
              $fail( 'Plugin consumer wiring is not authorized.' );
          }
          if ( false !== strpos( $service, 'SPDB_Collections_Service_Readiness_Consumer' ) ) {
              $fail( 'Service-side consumer integration is not authorized in this foundation slice.' );
          }
          foreach ( array(
              'register_rest_route(',
              'WP_REST_Server::CREATABLE',
              'WP_REST_Server::EDITABLE',
              'WP_REST_Server::DELETABLE',
              'wp_insert_post(', 'wp_update_post(', 'wp_delete_post(',
              'add_option(', 'update_option(', 'delete_option(',
              'add_user_meta(', 'update_user_meta(', 'delete_user_meta(',
              'add_post_meta(', 'update_post_meta(', 'delete_post_meta(',
              'set_transient(', 'delete_transient(',
              'file_put_contents(', 'fopen(', 'fwrite(',
              '->insert(', '->update(', '->delete(', '->query(',
              '->resolve_reference(', '::resolve_reference(',
          ) as $forbidden ) {
              if ( false !== strpos( $source, $forbidden ) ) { $fail( "Forbidden consumer operation: {$forbidden}" ); }
          }
          foreach ( array(
              'exact stable service health keys',
              'exact six-field shape',
              'Resolver presence must remain truthful',
              'must not probe repository or resolver readiness',
              'must reject cloning',
              'must reject serialization',
              'Missing resolver readiness contract',
              'second consumer must not touch the first consumer dependencies',
              'No Phase 23N consumer path may resolve a native object',
          ) as $needle ) {
              if ( false === stripos( $primary, $needle ) ) { $fail( "Missing primary evidence marker: {$needle}" ); }
          }
          foreach ( array(
              'stale schema version',
              'Malformed scalar repository health',
              'Contradictory aggregate repository health',
              'noncanonical repository code',
              'overlong repository code',
              'write-ready state without repository read readiness',
              'Knowledge readiness without resolver availability',
          ) as $needle ) {
              if ( false === stripos( $adversarial, $needle ) ) { $fail( "Missing adversarial evidence marker: {$needle}" ); }
          }
          foreach ( array(
              'DO NOT MERGE',
              'resolver presence',
              'aggregate repository readiness',
              'canonical code',
              'exact dependency-identity',
              'no consumer path may invoke',
              'service-internal consumption',
          ) as $needle ) {
              if ( false === stripos( $audit, $needle ) ) { $fail( "Missing audit marker: {$needle}" ); }
          }
          echo "Phase 23N bounded consumer static boundaries passed.\n";
          PHP

      - name: Record exact-source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/phase23n-collections-service-readiness-consumer.yml \
            docs/AUDIT-PHASE-23N-COLLECTIONS-SERVICE-READINESS-CONSUMER-2026-07-31.md \
            includes/interface-spdb-collections-repository.php \
            includes/interface-spdb-native-reference-resolver.php \
            includes/interface-spdb-native-reference-readiness.php \
            includes/class-spdb-collections-service-readiness-gate.php \
            includes/class-spdb-collections-service-readiness-integration.php \
            includes/class-spdb-collections-repository-readiness-probe.php \
            includes/class-spdb-collections-service-probe-binding.php \
            includes/class-spdb-collections-service-readiness-consumer.php \
            includes/class-spdb-collections-service.php \
            includes/class-spdb-plugin.php \
            tests/phase23h-readiness-bridge-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            tests/phase23j-collections-service-readiness-tests.php \
            tests/phase23k-collections-service-readiness-integration-tests.php \
            tests/phase23l-collections-repository-readiness-probe-tests.php \
            tests/phase23m-collections-service-probe-binding-tests.php \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/architecture-guard.php \
            > "qa-evidence/phase23n-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23N QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23n-service-readiness-consumer-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
