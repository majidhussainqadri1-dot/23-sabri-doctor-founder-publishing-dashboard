name: File 23 Third Fresh 80 Review Apply

on:
  push:
    branches:
      - feature/file23-2026-governing-plan-completion
    paths:
      - '.file23-third80/**'
      - '.github/workflows/file23-third-fresh-80-review-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply third fresh eighty-round corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.file23-third80/apply.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "out, count = re.subn(pattern, lambda m: replacement, text, count=1, flags=re.S)",
          )
          p.write_text(s, encoding='utf-8')
          PY
          python3 .file23-third80/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/third-fresh-80-export-contract-tests.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace('strpos( $export, "true !== ( $assertions[\'approved\'] ?? false )" )', "strpos( $export, 'true !== ( $assertions[\\'approved\\'] ?? false )' )")
          s = s.replace('strpos( $export, "true === ( $assertions[\'suspended\'] ?? true )" )', "strpos( $export, 'true === ( $assertions[\\'suspended\\'] ?? true )' )")
          s = s.replace('strpos( $export, "user_can( $user_id, \'spdb_export_reports\' )" )', "strpos( $export, 'user_can( $user_id, \\'spdb_export_reports\\' )' )")
          p.write_text(s.rstrip() + '\n', encoding='utf-8')
          PY
          php -l includes/class-spdb-export-service.php
          php -l includes/class-spdb-background-jobs.php
          php -l includes/class-spdb-publishing-intelligence.php
          php -l tests/third-fresh-80-export-contract-tests.php
          php tests/third-fresh-80-export-contract-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/publishing-intelligence-security-regression-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/publishing-intelligence-24-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/full-plan-security-adversarial-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/eighty-round-review-gate-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/fresh-review-1.3.0-gate-tests.php
          for suite in tests/*-tests.php; do
            echo "Running $suite"
            php -d display_errors=1 -d error_reporting=E_ALL "$suite"
          done
          git diff --check
      - name: Commit corrected exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .file23-third80
          rm -f .github/workflows/file23-third-fresh-80-review-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair delta produced."
            exit 1
          fi
          git commit -m "File 23: apply third fresh eighty-round corrections"
          git push origin HEAD:feature/file23-2026-governing-plan-completion
