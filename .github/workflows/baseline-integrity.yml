name: Baseline Integrity

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "Expected $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          }
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual_sha"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "qa-evidence/context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            STATUS.md
            SECURITY.md
            SOURCE-PROVENANCE.md
            DECISION-LOG.md
            CHANGELOG.md
            readme.txt
            sabri-publishing-dashboard.php
            docs/RESPONSIBILITY-MATRIX.md
            docs/DATA-OWNERSHIP.md
            docs/CAPABILITIES.md
            docs/ADAPTER-CONTRACT.md
            docs/STATE-PROJECTION.md
            docs/ANALYTICS-CONTRACT.md
            docs/BACKGROUND-JOBS.md
            docs/AUDIT-2026-07-30.md
            docs/AUDIT-PHASE-23B-2026-07-30.md
            docs/AUDIT-PHASE-23B-SECOND-REVIEW-2026-07-30.md
            docs/DASHBOARD-CORE.md
            docs/PHASE-23B-REVIEW-GATE.md
            includes/interface-spdb-provider-adapter.php
            includes/class-spdb-adapter-registry.php
            includes/class-spdb-membership-guard.php
            includes/class-spdb-capabilities.php
            includes/class-spdb-capability-installer.php
            includes/class-spdb-operation-broker.php
            includes/class-spdb-provider-registration.php
            includes/class-spdb-dashboard-router.php
            includes/class-spdb-workspace-resolver.php
            includes/class-spdb-saved-views.php
            includes/class-spdb-rest-privacy.php
            includes/class-spdb-system-state.php
            includes/class-spdb-overview-service.php
            includes/class-spdb-dashboard-page.php
            includes/class-spdb-plugin.php
            templates/dashboard.php
            assets/css/dashboard.css
            assets/css/dashboard-corrections.css
            assets/js/dashboard.js
            tests/bootstrap.php
            tests/fixtures/class-test-adapter.php
            tests/contract-tests.php
            tests/dashboard-core-tests.php
            tests/rest-privacy-tests.php
            tests/capability-installer-tests.php
            tests/provider-registration-tests.php
            tests/architecture-guard.php
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: JavaScript syntax check
        run: node --check assets/js/dashboard.js

      - name: Run executable contract tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/contract-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Run executable dashboard-core tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/dashboard-core-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Run REST privacy tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/rest-privacy-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Run capability installer tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/capability-installer-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Run provider registration isolation tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/provider-registration-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Run architecture boundary guard
        shell: bash
        run: |
          set -euo pipefail
          php tests/architecture-guard.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Verify private route controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "auth_redirect" includes/class-spdb-dashboard-router.php
          grep -q "spdb_view_dashboard" includes/class-spdb-dashboard-router.php
          grep -q "DONOTCACHEPAGE" includes/class-spdb-dashboard-router.php
          grep -q "private, no-store" includes/class-spdb-dashboard-router.php
          grep -q "X-Robots-Tag: noindex" includes/class-spdb-dashboard-router.php
          grep -q "protect_shortcode_page" includes/class-spdb-dashboard-page.php
          grep -q "rest_pre_serve_request" includes/class-spdb-rest-privacy.php
          grep -q "validate_callback" includes/class-spdb-saved-views.php
          grep -q "compare_and_store" includes/class-spdb-saved-views.php
          grep -q "SPDB_Capability_Installer" includes/class-spdb-plugin.php
          grep -q "SPDB_Provider_Registration::dispatch" includes/class-spdb-plugin.php
          grep -q "DO NOT MERGE before review is complete" docs/PHASE-23B-REVIEW-GATE.md

      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version:[[:space:]]*0.2.1" sabri-publishing-dashboard.php
          grep -q "Stable tag: 0.2.1" readme.txt
          grep -q "SPDB_CONTRACT_VERSION.*2.0.0" sabri-publishing-dashboard.php
          grep -q "Contract version: 2.0.0" includes/interface-spdb-provider-adapter.php

      - name: Verify audit and merge gates
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "DO NOT MERGE" docs/AUDIT-2026-07-30.md
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23B-2026-07-30.md
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23B-SECOND-REVIEW-2026-07-30.md
          grep -qi "Founder review completed" STATUS.md
          grep -qi "No merge before completed review" DECISION-LOG.md
          grep -qi "DO NOT MERGE before review is complete" docs/PHASE-23B-REVIEW-GATE.md

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find includes templates assets tests -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "qa-evidence/source-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23b-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
