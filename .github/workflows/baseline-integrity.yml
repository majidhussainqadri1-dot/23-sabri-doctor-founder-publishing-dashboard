name: Baseline Integrity

on:
  push:
    branches: [main, 'feature/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: file23-baseline-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/dashboard.js
          node --check assets/js/operations.js
          mapfile -t suites < <(find tests -maxdepth 1 -type f -name '*tests.php' | sort)
          test "${#suites[@]}" -ge 24
          for suite in "${suites[@]}"; do php -d display_errors=1 -d error_reporting=E_ALL "$suite"; done
          php tests/architecture-guard.php
      - name: Verify current full-plan release boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Version:     1.2.1" sabri-publishing-dashboard.php
          grep -Fq "Stable tag: 1.2.1" readme.txt
          grep -Fq "'phase'                   => 'full_plan_candidate'" includes/class-spdb-system-state.php
          grep -Fq 'class-spdb-operations-service.php' includes/class-spdb-plugin.php
          grep -Fq 'class-spdb-background-jobs.php' includes/class-spdb-plugin.php
          grep -Fq 'class-spdb-privacy-integration.php' includes/class-spdb-plugin.php
          grep -Fq 'spdb/file24_assurance_evidence' includes/class-spdb-plugin.php
          grep -Fq "global_safe_mode_owner' => 'file20" includes/class-spdb-local-repair.php
