name: Baseline Integrity

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual_sha"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "qa-evidence/context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md STATUS.md SECURITY.md SOURCE-PROVENANCE.md DECISION-LOG.md CHANGELOG.md readme.txt
            sabri-publishing-dashboard.php
            docs/RESPONSIBILITY-MATRIX.md docs/DATA-OWNERSHIP.md docs/CAPABILITIES.md
            docs/ADAPTER-CONTRACT.md docs/STATE-PROJECTION.md docs/ANALYTICS-CONTRACT.md docs/BACKGROUND-JOBS.md
            docs/AUDIT-2026-07-30.md docs/AUDIT-PHASE-23B-2026-07-30.md
            docs/AUDIT-PHASE-23B-SECOND-REVIEW-2026-07-30.md docs/AUDIT-PHASE-23C-2026-07-30.md
            docs/AUDIT-PHASE-23D-2026-07-30.md docs/ROLE-WORKSPACES.md docs/PHASE-23D-REVIEW-GATE.md
            includes/interface-spdb-provider-adapter.php includes/interface-spdb-workspace-provider-adapter.php
            includes/class-spdb-adapter-registry.php includes/class-spdb-membership-guard.php
            includes/class-spdb-capabilities.php includes/class-spdb-capability-installer.php
            includes/class-spdb-operation-broker.php includes/class-spdb-provider-registration.php
            includes/class-spdb-inventory-query.php includes/class-spdb-projection-validator.php
            includes/class-spdb-federated-inventory.php includes/class-spdb-inventory-rest-controller.php
            includes/class-spdb-safe-destination.php includes/class-spdb-workspace-projection-validator.php
            includes/class-spdb-role-workspace-service.php includes/class-spdb-dashboard-router.php
            includes/class-spdb-workspace-resolver.php includes/class-spdb-saved-views.php
            includes/class-spdb-rest-privacy.php includes/class-spdb-system-state.php
            includes/class-spdb-overview-service.php includes/class-spdb-dashboard-page.php includes/class-spdb-plugin.php
            templates/dashboard.php templates/inventory.php templates/workspace.php
            assets/css/dashboard.css assets/css/dashboard-corrections.css assets/css/inventory.css assets/css/workspace.css assets/js/dashboard.js
            tests/bootstrap.php tests/fixtures/class-test-adapter.php tests/fixtures/class-test-workspace-adapter.php
            tests/contract-tests.php tests/dashboard-core-tests.php tests/rest-privacy-tests.php
            tests/capability-installer-tests.php tests/provider-registration-tests.php
            tests/inventory-tests.php tests/workspace-tests.php tests/architecture-guard.php
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: JavaScript syntax check
        run: node --check assets/js/dashboard.js

      - name: Run executable contract tests
        run: php tests/contract-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run executable dashboard-core tests
        run: php tests/dashboard-core-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run REST privacy tests
        run: php tests/rest-privacy-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run capability installer tests
        run: php tests/capability-installer-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run provider registration isolation tests
        run: php tests/provider-registration-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective federated inventory tests
        run: php tests/inventory-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective role-workspace tests
        run: php tests/workspace-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run architecture boundary guard
        run: php tests/architecture-guard.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Verify corrective Phase 23D controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "derive_context" includes/class-spdb-role-workspace-service.php
          grep -q "action_contract" includes/class-spdb-workspace-projection-validator.php
          grep -q "spdb_workspace_action_contract_mismatch" includes/class-spdb-workspace-projection-validator.php
          grep -q "is_environment_write_eligible" includes/class-spdb-role-workspace-service.php
          grep -q "MAX_PROVIDERS" includes/class-spdb-role-workspace-service.php
          grep -q "MAX_ACTIONS" includes/class-spdb-role-workspace-service.php
          grep -q "gmdate" includes/class-spdb-role-workspace-service.php
          grep -q "validate_raw_query" includes/class-spdb-safe-destination.php
          grep -q "Opens native management" templates/workspace.php
          ! grep -q "edit_destination" templates/workspace.php
          ! grep -q "public_destination" templates/workspace.php
          ! grep -q "knowledge\['destination'\]" templates/workspace.php
          ! grep -Eq 'content[[:space:]]*:' assets/css/workspace.css
          ! grep -Eq '<form\b|<button\b' templates/workspace.php

      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version:[[:space:]]*0.4.1" sabri-publishing-dashboard.php
          grep -q "Stable tag: 0.4.1" readme.txt
          grep -q "SPDB_VERSION.*0.4.1" sabri-publishing-dashboard.php
          grep -q "SPDB_VERSION.*0.4.1" tests/bootstrap.php
          grep -q "SPDB_CONTRACT_VERSION.*2.0.0" sabri-publishing-dashboard.php
          grep -q "'phase'[[:space:]]*=>[[:space:]]*'23D'" includes/class-spdb-system-state.php

      - name: Verify audit and merge gates
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23D-2026-07-30.md
          grep -qi "sixteen" docs/AUDIT-PHASE-23D-2026-07-30.md
          grep -qi "Independent review completed" docs/PHASE-23D-REVIEW-GATE.md
          grep -qi "Founder review completed" STATUS.md
          grep -qi "No Merge before Completed Review" DECISION-LOG.md

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find includes templates assets tests docs -type f -print0 | sort -z | xargs -0 sha256sum > "qa-evidence/source-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23d-corrective-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
