name: Baseline Integrity

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            STATUS.md
            SECURITY.md
            SOURCE-PROVENANCE.md
            DECISION-LOG.md
            CHANGELOG.md
            readme.txt
            sabri-publishing-dashboard.php
            docs/RESPONSIBILITY-MATRIX.md
            docs/DATA-OWNERSHIP.md
            docs/CAPABILITIES.md
            docs/ADAPTER-CONTRACT.md
            docs/STATE-PROJECTION.md
            docs/ANALYTICS-CONTRACT.md
            docs/BACKGROUND-JOBS.md
            includes/interface-spdb-provider-adapter.php
            includes/class-spdb-adapter-registry.php
            includes/class-spdb-capabilities.php
            includes/class-spdb-plugin.php
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version:[[:space:]]*0.1.0" sabri-publishing-dashboard.php
          grep -q "Stable tag: 0.1.0" readme.txt
          grep -q "SPDB_CONTRACT_VERSION.*1.0.0" sabri-publishing-dashboard.php

      - name: Guard architectural boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "POST /spdb/v1/action" . --exclude-dir=.git
          ! grep -R "CREATE TABLE.*publication" . --include='*.php' --exclude-dir=.git
          ! grep -R "CREATE TABLE.*comment" . --include='*.php' --exclude-dir=.git
          ! grep -R "CREATE TABLE.*correction" . --include='*.php' --exclude-dir=.git
          ! grep -R "CREATE TABLE.*retraction" . --include='*.php' --exclude-dir=.git
