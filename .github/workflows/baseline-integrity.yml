name: Baseline Integrity

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$actual_sha"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "qa-evidence/context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md STATUS.md SECURITY.md SOURCE-PROVENANCE.md DECISION-LOG.md CHANGELOG.md readme.txt
            sabri-publishing-dashboard.php
            docs/RESPONSIBILITY-MATRIX.md docs/DATA-OWNERSHIP.md docs/CAPABILITIES.md
            docs/ADAPTER-CONTRACT.md docs/STATE-PROJECTION.md docs/ANALYTICS-CONTRACT.md docs/BACKGROUND-JOBS.md
            docs/AUDIT-2026-07-30.md docs/AUDIT-PHASE-23B-2026-07-30.md
            docs/AUDIT-PHASE-23B-SECOND-REVIEW-2026-07-30.md docs/AUDIT-PHASE-23C-2026-07-30.md
            docs/AUDIT-PHASE-23D-2026-07-30.md docs/ROLE-WORKSPACES.md docs/PHASE-23D-REVIEW-GATE.md
            docs/AUDIT-PHASE-23E-2026-07-30.md docs/REVIEW-CALENDAR.md docs/PHASE-23E-REVIEW-GATE.md
            docs/AUDIT-PHASE-23F-2026-07-30.md docs/AUDIT-PHASE-23F-RUNTIME-SECOND-REVIEW-2026-07-30.md
            docs/AUDIT-PHASE-23F-THIRD-REVIEW-2026-07-31.md docs/AUDIT-PHASE-23F-COLLECTIONS-UI-2026-07-31.md
            docs/COLLECTIONS-KNOWLEDGE.md docs/PHASE-23F-REVIEW-GATE.md docs/PHASE-23F-STATUS.md
            docs/AUDIT-PHASE-23G-NATIVE-REFERENCE-RESOLUTION-2026-07-31.md
            includes/interface-spdb-provider-adapter.php includes/interface-spdb-workspace-provider-adapter.php
            includes/interface-spdb-review-calendar-provider-adapter.php includes/interface-spdb-collections-repository.php
            includes/interface-spdb-native-reference-resolver.php includes/interface-spdb-native-reference-provider.php
            includes/class-spdb-adapter-registry.php includes/class-spdb-native-reference-registry.php
            includes/class-spdb-native-reference-registration.php includes/class-spdb-membership-guard.php
            includes/class-spdb-capabilities.php includes/class-spdb-capability-installer.php
            includes/class-spdb-operation-broker.php includes/class-spdb-provider-registration.php
            includes/class-spdb-inventory-query.php includes/class-spdb-projection-validator.php
            includes/class-spdb-federated-inventory.php includes/class-spdb-inventory-rest-controller.php
            includes/class-spdb-safe-destination.php includes/class-spdb-workspace-projection-validator.php
            includes/class-spdb-role-workspace-service.php includes/class-spdb-review-calendar-validator.php
            includes/class-spdb-review-calendar-service.php includes/class-spdb-review-calendar-rest-controller.php
            includes/class-spdb-collections-schema.php includes/class-spdb-collections-policy.php
            includes/class-spdb-wp-collections-repository.php includes/class-spdb-collections-service.php
            includes/class-spdb-collections-view.php includes/class-spdb-collections-rest-controller.php
            includes/class-spdb-dashboard-router.php includes/class-spdb-workspace-resolver.php
            includes/class-spdb-saved-views.php includes/class-spdb-rest-privacy.php
            includes/class-spdb-system-state.php includes/class-spdb-overview-service.php
            includes/class-spdb-dashboard-page.php includes/class-spdb-plugin.php
            templates/dashboard.php templates/inventory.php templates/workspace.php templates/review.php templates/calendar.php templates/collections.php
            assets/css/dashboard.css assets/css/dashboard-corrections.css assets/css/inventory.css assets/css/workspace.css assets/css/review-calendar.css assets/css/collections.css
            assets/js/dashboard.js
            tests/bootstrap.php tests/fixtures/class-test-adapter.php tests/fixtures/class-test-workspace-adapter.php
            tests/fixtures/class-test-review-calendar-adapter.php tests/fixtures/class-test-native-reference-provider.php
            tests/contract-tests.php tests/dashboard-core-tests.php tests/rest-privacy-tests.php
            tests/capability-installer-tests.php tests/provider-registration-tests.php
            tests/inventory-tests.php tests/workspace-tests.php tests/review-calendar-tests.php
            tests/phase23f-policy-tests.php tests/phase23f-runtime-tests.php tests/phase23f-repository-tests.php
            tests/phase23f-read-rest-tests.php tests/phase23f-collections-ui-tests.php
            tests/phase23f-collections-ui-corrective-tests.php tests/dashboard-router-malformed-view-tests.php
            tests/phase23g-native-reference-tests.php tests/phase23g-native-reference-drift-tests.php tests/architecture-guard.php
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: JavaScript syntax check
        run: node --check assets/js/dashboard.js

      - name: Run executable contract tests
        run: set -o pipefail; php tests/contract-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run executable dashboard-core tests
        run: set -o pipefail; php tests/dashboard-core-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run REST privacy tests
        run: set -o pipefail; php tests/rest-privacy-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run capability installer tests
        run: set -o pipefail; php tests/capability-installer-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run provider registration isolation tests
        run: set -o pipefail; php tests/provider-registration-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective federated inventory tests
        run: set -o pipefail; php tests/inventory-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective role-workspace tests
        run: set -o pipefail; php tests/workspace-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective review and calendar tests
        run: set -o pipefail; php tests/review-calendar-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run Phase 23F policy tests
        run: set -o pipefail; php tests/phase23f-policy-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective Phase 23F runtime tests
        run: set -o pipefail; php tests/phase23f-runtime-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective Phase 23F repository tests
        run: set -o pipefail; php tests/phase23f-repository-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run Phase 23F read REST and item authority tests
        run: set -o pipefail; php tests/phase23f-read-rest-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run Phase 23F Collections UI tests
        run: set -o pipefail; php tests/phase23f-collections-ui-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run corrective Collections UI tests
        run: set -o pipefail; php tests/phase23f-collections-ui-corrective-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run malformed dashboard route tests
        run: set -o pipefail; php tests/dashboard-router-malformed-view-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run Phase 23G native resolver tests
        run: set -o pipefail; php tests/phase23g-native-reference-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run Phase 23G contract drift tests
        run: set -o pipefail; php tests/phase23g-native-reference-drift-tests.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"
      - name: Run architecture boundary guard
        run: set -o pipefail; php tests/architecture-guard.php | tee -a "qa-evidence/tests-php-${{ matrix.php }}.log"

      - name: Verify Phase 23F and 23G controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VERSION = '3'" includes/class-spdb-collections-schema.php
          grep -q "refresh_health" includes/class-spdb-wp-collections-repository.php
          grep -q "spdb_knowledge_relation_conflict" includes/class-spdb-wp-collections-repository.php
          grep -q "list_collection_items" includes/class-spdb-collections-service.php
          grep -q "validate_item_record" includes/class-spdb-collections-service.php
          grep -q "SPDB_Collections_REST_Controller" includes/class-spdb-collections-rest-controller.php
          grep -q "WP_REST_Server::READABLE" includes/class-spdb-collections-rest-controller.php
          ! grep -Eq 'WP_REST_Server::(CREATABLE|EDITABLE|DELETABLE)|\b(?:POST|PUT|PATCH|DELETE)\b' includes/class-spdb-collections-rest-controller.php
          grep -q 'interface SPDB_Native_Reference_Provider' includes/interface-spdb-native-reference-provider.php
          grep -q 'implements SPDB_Native_Reference_Resolver' includes/class-spdb-native-reference-registry.php
          grep -q 'adapter_acceptance_state' includes/class-spdb-native-reference-registry.php
          grep -q 'validated_context' includes/class-spdb-native-reference-registry.php
          grep -q 'spdb_native_resolver_provider_error' includes/class-spdb-native-reference-registry.php
          grep -q 'provider_contract_is_current' includes/class-spdb-native-reference-registry.php
          grep -q 'contract_drift' includes/class-spdb-native-reference-registry.php
          grep -q 'spdb/register_native_reference_resolvers' includes/class-spdb-native-reference-registration.php
          grep -q 'new SPDB_Native_Reference_Registry( \$this->adapter_registry, array() )' includes/class-spdb-plugin.php
          grep -q 'new SPDB_Collections_Service( \$this->collections_repository )' includes/class-spdb-plugin.php
          ! grep -Eq 'new SPDB_Collections_Service\([^;]*native_reference_registry' includes/class-spdb-plugin.php
          ! grep -Eq 'register_rest_route\s*\(' includes/class-spdb-native-reference-registry.php includes/class-spdb-native-reference-registration.php

      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version:[[:space:]]*0.7.0" sabri-publishing-dashboard.php
          grep -q "Stable tag: 0.7.0" readme.txt
          grep -q "SPDB_VERSION.*0.7.0" sabri-publishing-dashboard.php
          grep -q "SPDB_VERSION.*0.7.0" tests/bootstrap.php
          grep -q "SPDB_CONTRACT_VERSION.*2.0.0" sabri-publishing-dashboard.php
          grep -q "'phase'.*'23G'" includes/class-spdb-system-state.php

      - name: Verify audit and merge gates
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23F-2026-07-30.md
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23F-RUNTIME-SECOND-REVIEW-2026-07-30.md
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23F-THIRD-REVIEW-2026-07-31.md
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23F-COLLECTIONS-UI-2026-07-31.md
          grep -qi "DO NOT MERGE" docs/AUDIT-PHASE-23G-NATIVE-REFERENCE-RESOLUTION-2026-07-31.md
          grep -qi "sixteen" docs/AUDIT-PHASE-23G-NATIVE-REFERENCE-RESOLUTION-2026-07-31.md
          grep -qi "Founder review completed" STATUS.md
          grep -qi "No Merge before Completed Review" DECISION-LOG.md

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find includes templates assets tests docs -type f -print0 | sort -z | xargs -0 sha256sum > "qa-evidence/source-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23g-baseline-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
