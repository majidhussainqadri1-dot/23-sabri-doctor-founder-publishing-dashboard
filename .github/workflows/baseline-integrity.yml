name: Baseline Integrity

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            STATUS.md
            SECURITY.md
            SOURCE-PROVENANCE.md
            DECISION-LOG.md
            CHANGELOG.md
            readme.txt
            sabri-publishing-dashboard.php
            docs/RESPONSIBILITY-MATRIX.md
            docs/DATA-OWNERSHIP.md
            docs/CAPABILITIES.md
            docs/ADAPTER-CONTRACT.md
            docs/STATE-PROJECTION.md
            docs/ANALYTICS-CONTRACT.md
            docs/BACKGROUND-JOBS.md
            docs/AUDIT-2026-07-30.md
            docs/DASHBOARD-CORE.md
            docs/PHASE-23B-REVIEW-GATE.md
            includes/interface-spdb-provider-adapter.php
            includes/class-spdb-adapter-registry.php
            includes/class-spdb-membership-guard.php
            includes/class-spdb-capabilities.php
            includes/class-spdb-operation-broker.php
            includes/class-spdb-dashboard-router.php
            includes/class-spdb-workspace-resolver.php
            includes/class-spdb-saved-views.php
            includes/class-spdb-rest-privacy.php
            includes/class-spdb-system-state.php
            includes/class-spdb-overview-service.php
            includes/class-spdb-dashboard-page.php
            includes/class-spdb-plugin.php
            templates/dashboard.php
            assets/css/dashboard.css
            assets/js/dashboard.js
            tests/bootstrap.php
            tests/fixtures/class-test-adapter.php
            tests/contract-tests.php
            tests/dashboard-core-tests.php
            tests/rest-privacy-tests.php
            tests/architecture-guard.php
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: JavaScript syntax check
        run: node --check assets/js/dashboard.js

      - name: Run executable contract tests
        run: php tests/contract-tests.php

      - name: Run executable dashboard-core tests
        run: php tests/dashboard-core-tests.php

      - name: Run REST privacy tests
        run: php tests/rest-privacy-tests.php

      - name: Run architecture boundary guard
        run: php tests/architecture-guard.php

      - name: Verify private route controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "auth_redirect" includes/class-spdb-dashboard-router.php
          grep -q "spdb_view_dashboard" includes/class-spdb-dashboard-router.php
          grep -q "private, no-store" includes/class-spdb-dashboard-router.php
          grep -q "X-Robots-Tag: noindex" includes/class-spdb-dashboard-router.php
          grep -q "protect_shortcode_page" includes/class-spdb-dashboard-page.php
          grep -q "rest_post_dispatch" includes/class-spdb-rest-privacy.php
          grep -q "permission_callback" includes/class-spdb-saved-views.php
          grep -q "patient_id" tests/dashboard-core-tests.php
          grep -q "DO NOT MERGE before review is complete" docs/PHASE-23B-REVIEW-GATE.md

      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version:[[:space:]]*0.2.0" sabri-publishing-dashboard.php
          grep -q "Stable tag: 0.2.0" readme.txt
          grep -q "SPDB_CONTRACT_VERSION.*2.0.0" sabri-publishing-dashboard.php
          grep -q "Contract version: 2.0.0" includes/interface-spdb-provider-adapter.php

      - name: Verify audit and merge gates
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "DO NOT MERGE" docs/AUDIT-2026-07-30.md
          grep -qi "Founder review completed" STATUS.md
          grep -qi "No merge before completed review" DECISION-LOG.md
          grep -qi "DO NOT MERGE before review is complete" docs/PHASE-23B-REVIEW-GATE.md
