name: Phase 23O Exact Source Export

on:
  push:
    branches: ['phase/23o-collections-service-internal-consumption']
    paths: ['.github/workflows/phase23o-source-export.yml']
  pull_request:
    paths: ['.github/workflows/phase23o-source-export.yml']

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact branch head
        run: |
          set -euo pipefail
          mkdir -p phase23o-source
          git rev-parse HEAD > phase23o-source/HEAD.txt
      - name: Copy reviewed source inputs
        run: |
          set -euo pipefail
          cp includes/class-spdb-collections-service.php phase23o-source/
          cp includes/class-spdb-collections-service-readiness-consumer.php phase23o-source/
          cp includes/class-spdb-plugin.php phase23o-source/
          cp includes/class-spdb-system-state.php phase23o-source/
          cp tests/phase23f-runtime-tests.php phase23o-source/
          cp tests/bootstrap.php phase23o-source/
          sha256sum phase23o-source/* > phase23o-source/SHA256SUMS.txt
      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase23o-exact-source-${{ github.run_id }}
          path: phase23o-source/
          if-no-files-found: error
          retention-days: 7
