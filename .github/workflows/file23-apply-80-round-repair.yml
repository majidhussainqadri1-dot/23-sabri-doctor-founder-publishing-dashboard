name: File 23 Apply 80-Round Repair

on:
  push:
    branches:
      - feature/file23-2026-governing-plan-completion
    paths:
      - '.file23-repair/**'
      - '.github/workflows/file23-apply-80-round-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply corrected tree
        shell: bash
        run: |
          set -euo pipefail
          cat .file23-repair/chunk-* | base64 -d | tar -xzf -
          sed -i 's/[[:space:]]\+$//' docs/AUDIT-80-ROUND-REVIEW-AND-CORRECTIONS-2026-08-10.md
          rm -rf .file23-repair
          rm -f .github/workflows/file23-apply-80-round-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair delta was produced."
            exit 1
          fi
          git commit -m "File 23: apply eighty-round review corrections"
          git push origin HEAD:feature/file23-2026-governing-plan-completion
