name: Phase 23H Resolver Readiness Bridge

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  readiness-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\nactual_sha=%s\nrun_id=%s\nphp=%s\n' "$EXPECTED_SHA" "$actual_sha" "$GITHUB_RUN_ID" "${{ matrix.php }}" > "qa-evidence/phase23h-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify Phase 23H foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/AUDIT-PHASE-23H-RESOLVER-READINESS-BRIDGE-2026-07-31.md
            includes/interface-spdb-native-reference-readiness.php
            includes/class-spdb-native-reference-readiness-bridge.php
            tests/phase23h-readiness-bridge-tests.php
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/interface-spdb-native-reference-readiness.php
          php -l includes/class-spdb-native-reference-readiness-bridge.php
          php -l tests/phase23h-readiness-bridge-tests.php

      - name: Run Phase 23H readiness bridge tests
        shell: bash
        run: set -o pipefail; php tests/phase23h-readiness-bridge-tests.php | tee "qa-evidence/phase23h-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23G contract drift regression
        shell: bash
        run: set -o pipefail; php tests/phase23g-native-reference-drift-tests.php | tee -a "qa-evidence/phase23h-tests-php-${{ matrix.php }}.log"

      - name: Run architecture regression guard
        shell: bash
        run: set -o pipefail; php tests/architecture-guard.php | tee -a "qa-evidence/phase23h-tests-php-${{ matrix.php }}.log"

      - name: Verify bounded foundation and no runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'interface SPDB_Native_Reference_Readiness' includes/interface-spdb-native-reference-readiness.php
          grep -q 'implements SPDB_Native_Reference_Resolver, SPDB_Native_Reference_Readiness' includes/class-spdb-native-reference-readiness-bridge.php
          grep -q 'spdb_native_reference_resolver_not_ready' includes/class-spdb-native-reference-readiness-bridge.php
          grep -q 'readiness_exception' includes/class-spdb-native-reference-readiness-bridge.php
          ! grep -q 'interface-spdb-native-reference-readiness.php' includes/class-spdb-plugin.php
          ! grep -q 'class-spdb-native-reference-readiness-bridge.php' includes/class-spdb-plugin.php
          ! grep -Eq 'register_rest_route\s*\(|WP_REST_Server::(CREATABLE|EDITABLE|DELETABLE)|\b(?:POST|PUT|PATCH|DELETE)\b' includes/class-spdb-native-reference-readiness-bridge.php
          ! grep -Eq '\b(?:insert|update|delete)_?(?:option|post|metadata)?\s*\(' includes/class-spdb-native-reference-readiness-bridge.php
          grep -qi 'DO NOT MERGE' docs/AUDIT-PHASE-23H-RESOLVER-READINESS-BRIDGE-2026-07-31.md

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            includes/interface-spdb-native-reference-readiness.php \
            includes/class-spdb-native-reference-readiness-bridge.php \
            tests/phase23h-readiness-bridge-tests.php \
            docs/AUDIT-PHASE-23H-RESOLVER-READINESS-BRIDGE-2026-07-31.md \
            > "qa-evidence/phase23h-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23H QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23h-readiness-bridge-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
