name: File 23 One Shot Guard Normalization

on:
  push:
    branches:
      - feature/file23-full-plan-completion

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-guard-normalization]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/file23-full-plan-completion
          fetch-depth: 0
      - name: Normalize architecture paths and schema exceptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/architecture-guard.php')
          text = path.read_text()
          old = "\t$path     = $file->getPathname();\n\t$relative = ltrim( str_replace( $root, '', $path ), DIRECTORY_SEPARATOR );\n\tif ( str_starts_with( $relative, 'tests' . DIRECTORY_SEPARATOR ) || str_starts_with( $relative, 'vendor' . DIRECTORY_SEPARATOR ) ) {"
          new = "\t$path                = $file->getPathname();\n\t$relative            = ltrim( str_replace( $root, '', $path ), DIRECTORY_SEPARATOR );\n\t$relative_normalized = str_replace( DIRECTORY_SEPARATOR, '/', $relative );\n\tif ( str_starts_with( $relative_normalized, 'tests/' ) || str_starts_with( $relative_normalized, 'vendor/' ) ) {"
          if old not in text:
              raise SystemExit('relative path block not found')
          text = text.replace(old, new, 1)
          text = text.replace("if ( ! in_array( $relative, $broker_execution_files, true )", "if ( ! in_array( $relative_normalized, array_map( static fn( string $path ): string => str_replace( DIRECTORY_SEPARATOR, '/', $path ), $broker_execution_files ), true )", 1)
          text = text.replace("$is_allowed_schema = in_array( $relative, $allowed_schema_files, true );", "$normalized_allowed_schema_files = array_map( static fn( string $path ): string => str_replace( DIRECTORY_SEPARATOR, '/', $path ), $allowed_schema_files );\n\t$is_allowed_schema = in_array( $relative_normalized, $normalized_allowed_schema_files, true )\n\t\t|| str_ends_with( $relative_normalized, '/class-spdb-collections-schema.php' )\n\t\t|| str_ends_with( $relative_normalized, '/class-spdb-operations-schema.php' );", 1)
          path.write_text(text)
          PY
          php -l tests/architecture-guard.php
          php tests/architecture-guard.php
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/architecture-guard.php
          git commit -m 'Normalize architecture guard schema path matching'
          git push origin HEAD:feature/file23-full-plan-completion
