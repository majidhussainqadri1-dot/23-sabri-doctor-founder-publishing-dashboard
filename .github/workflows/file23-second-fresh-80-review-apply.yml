name: File 23 Second Fresh 80 Review Apply

on:
  push:
    branches:
      - feature/file23-2026-governing-plan-completion
    paths:
      - '.file23-fresh80/**'
      - '.github/workflows/file23-second-fresh-80-review-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply second fresh eighty-round corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .file23-fresh80/apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('STATUS.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          php -l includes/class-spdb-publishing-intelligence.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/publishing-intelligence-security-regression-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/publishing-intelligence-24-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/eighty-round-review-gate-tests.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/fresh-review-1.3.0-gate-tests.php
          git diff --check
      - name: Commit corrected exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .file23-fresh80
          rm -f .github/workflows/file23-second-fresh-80-review-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair delta produced."
            exit 1
          fi
          git commit -m "File 23: apply second fresh eighty-round corrections"
          git push origin HEAD:feature/file23-2026-governing-plan-completion
