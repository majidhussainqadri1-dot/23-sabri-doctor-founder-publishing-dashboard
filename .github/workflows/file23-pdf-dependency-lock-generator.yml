name: File23 PDF dependency lock generation (temporary, draft-only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'fix/file23-v12-1-export-guard-integrity-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: gd, mbstring, xml, zlib
          coverage: none
      - name: Resolve locked compatible mPDF dependencies for PHP 8.0
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          COMPOSER_NO_INTERACTION=1 composer update --no-dev --no-scripts --no-plugins --prefer-dist --no-progress
          composer validate --no-check-publish
          echo 'FILE23_LOCK_BEGIN'
          cat composer.lock
          echo 'FILE23_LOCK_END'
