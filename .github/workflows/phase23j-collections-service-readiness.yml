name: Phase 23J Collections Service Readiness Gate

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase23j-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\nactual_sha=%s\nrun_id=%s\nphp=%s\n' "$EXPECTED_SHA" "$actual_sha" "$GITHUB_RUN_ID" "${{ matrix.php }}" > "qa-evidence/phase23j-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify Phase 23J files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .github/workflows/phase23j-collections-service-readiness.yml
            docs/AUDIT-PHASE-23J-COLLECTIONS-SERVICE-READINESS-GATE-2026-07-31.md
            includes/interface-spdb-native-reference-readiness.php
            includes/class-spdb-native-reference-readiness-bridge.php
            includes/class-spdb-native-reference-registry-readiness.php
            includes/class-spdb-collections-service-readiness-gate.php
            includes/class-spdb-collections-service.php
            includes/class-spdb-plugin.php
            tests/phase23h-readiness-bridge-tests.php
            tests/phase23i-registry-readiness-tests.php
            tests/phase23j-collections-service-readiness-tests.php
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/interface-spdb-native-reference-readiness.php
          php -l includes/class-spdb-native-reference-readiness-bridge.php
          php -l includes/class-spdb-native-reference-registry-readiness.php
          php -l includes/class-spdb-collections-service-readiness-gate.php
          php -l tests/phase23h-readiness-bridge-tests.php
          php -l tests/phase23i-registry-readiness-tests.php
          php -l tests/phase23j-collections-service-readiness-tests.php

      - name: Run third-corrective Phase 23J service readiness tests
        shell: bash
        run: set -o pipefail; php tests/phase23j-collections-service-readiness-tests.php | tee "qa-evidence/phase23j-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23I conformance regression
        shell: bash
        run: set -o pipefail; php tests/phase23i-registry-readiness-tests.php | tee -a "qa-evidence/phase23j-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23H bridge regression
        shell: bash
        run: set -o pipefail; php tests/phase23h-readiness-bridge-tests.php | tee -a "qa-evidence/phase23j-tests-php-${{ matrix.php }}.log"

      - name: Run architecture guard
        shell: bash
        run: set -o pipefail; php tests/architecture-guard.php | tee -a "qa-evidence/phase23j-tests-php-${{ matrix.php }}.log"

      - name: Verify corrected isolated gate and no runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'final class SPDB_Collections_Service_Readiness_Gate' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'require_collection_write_ready' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'require_knowledge_write_ready' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'valid_gate_inputs' includes/class-spdb-collections-service-readiness-gate.php
          grep -q "'inputs_valid'" includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'gate_input_invalid' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'resolver_not_evaluated' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'resolver_readiness_available' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'resolver_readiness_invalid' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'resolver_readiness_exception' includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'resolver_readiness_reentrant' includes/class-spdb-collections-service-readiness-gate.php
          grep -q "'ready' !== \$source\['code'\]" includes/class-spdb-collections-service-readiness-gate.php
          grep -q "'ready' === \$source\['code'\]" includes/class-spdb-collections-service-readiness-gate.php
          grep -q 'finally' includes/class-spdb-collections-service-readiness-gate.php
          ! grep -Eq 'function (snapshot|require_collection_write_ready|require_knowledge_write_ready)\( bool ' includes/class-spdb-collections-service-readiness-gate.php
          ! grep -q 'class-spdb-collections-service-readiness-gate.php' includes/class-spdb-plugin.php
          ! grep -q 'SPDB_Collections_Service_Readiness_Gate' includes/class-spdb-collections-service.php
          ! grep -Eq 'register_rest_route\s*\(|WP_REST_Server::(CREATABLE|EDITABLE|DELETABLE)|\b(?:POST|PUT|PATCH|DELETE)\b' includes/class-spdb-collections-service-readiness-gate.php
          ! grep -Eq '\b(?:insert|update|delete)_?(?:option|post|metadata)?\s*\(' includes/class-spdb-collections-service-readiness-gate.php
          grep -qi 'DO NOT MERGE' docs/AUDIT-PHASE-23J-COLLECTIONS-SERVICE-READINESS-GATE-2026-07-31.md

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/phase23j-collections-service-readiness.yml \
            includes/interface-spdb-native-reference-readiness.php \
            includes/class-spdb-native-reference-readiness-bridge.php \
            includes/class-spdb-native-reference-registry-readiness.php \
            includes/class-spdb-collections-service-readiness-gate.php \
            includes/class-spdb-collections-service.php \
            includes/class-spdb-plugin.php \
            tests/phase23j-collections-service-readiness-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            tests/phase23h-readiness-bridge-tests.php \
            docs/AUDIT-PHASE-23J-COLLECTIONS-SERVICE-READINESS-GATE-2026-07-31.md \
            > "qa-evidence/phase23j-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23J QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23j-service-readiness-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
