name: Phase 23O Migrate Retained Evidence PR

on:
  pull_request:
    branches: ['phase/23n-internal-collections-service-probe-consumption']
    paths:
      - '.github/workflows/phase23o-migrate-retained-evidence-pr.yml'
      - '.github/workflows/phase23o-migrate-retained-evidence.yml'

permissions:
  contents: write

jobs:
  migrate-retained-evidence:
    if: github.head_ref == 'phase/23o-collections-service-internal-consumption'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Phase 23O branch
        uses: actions/checkout@v5
        with:
          ref: phase/23o-collections-service-internal-consumption
          fetch-depth: 0

      - name: Apply exact reviewed evidence migrations
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def exact_replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}')
              p.write_text(text.replace(old, new, expected))

          exact_replace(
              'tests/phase23f-policy-tests.php',
              "'spdb_phase23f_writes_disabled' === spdb_23f_code( $disabled )",
              "'spdb_collections_writes_disabled' === spdb_23f_code( $disabled )",
          )
          exact_replace(
              'tests/phase23f-collections-ui-tests.php',
              "public function health_check(): array { return array( 'healthy' => true, 'schema_ready' => true, 'code' => 'ready' ); }",
              "public function health_check(): array { return array( 'healthy' => true, 'database_ready' => true, 'schema_ready' => true, 'schema_version' => SPDB_Collections_Schema::VERSION, 'code' => 'ready', 'cached_for_request' => true ); }",
          )
          exact_replace(
              'tests/architecture-guard.php',
              "foreach ( array( 'SPDB_PHASE23F_WRITES_ENABLED', 'resolve_reference', 'validate_contributors', 'idempotency_hash', 'relation_hash', 'repository_available', 'resolver_available' ) as $marker ) {",
              "foreach ( array( 'SPDB_PHASE23F_WRITES_ENABLED', 'resolve_reference', 'validate_contributors', 'idempotency_hash', 'relation_hash', 'SPDB_Collections_Service_Readiness_Consumer', 'return $this->readiness->health', 'return $this->readiness->require_read_ready', 'return $this->readiness->require_write_ready' ) as $marker ) {",
          )
          exact_replace(
              'tests/architecture-guard.php',
              "\t\tif ( preg_match( '/register_rest_route\\s*\\(/i', $content ) ) { $violations[] = 'Phase 23F runtime service must not expose mutation REST routes'; }",
              "\t\tif ( preg_match( '/register_rest_route\\s*\\(/i', $content ) ) { $violations[] = 'Phase 23F runtime service must not expose mutation REST routes'; }\n\t\tif ( str_contains( $content, '$this->repository->health_check()' ) ) { $violations[] = 'Phase 23O runtime service must not bypass the reviewed readiness consumer with direct health checks'; }\n\t\tif ( ! str_contains( $content, 'private function resolve_reference_after_gate' ) || ! str_contains( $content, '$gate = $this->write_gate( true )' ) ) { $violations[] = 'Phase 23O direct native resolution must remain readiness-gated'; }",
          )

          phase23o_guard = """          $phase23o = is_file( 'docs/AUDIT-PHASE-23O-COLLECTIONS-SERVICE-INTERNAL-CONSUMPTION-2026-07-31.md' )
              && is_file( 'tests/phase23o-collections-service-internal-consumption-tests.php' )
              && is_file( '.github/workflows/phase23o-collections-service-internal-consumption.yml' );
          if ( false !== strpos( $service, 'SPDB_Collections_Service_Readiness_Consumer' ) ) {
              if ( ! $phase23o ) {
                  $fail( 'Service-side consumer integration requires the reviewed Phase 23O evidence set.' );
              }
              foreach ( array(
                  'private SPDB_Collections_Service_Readiness_Consumer $readiness',
                  'SPDB_Collections_Service_Readiness_Consumer::create( $repository, $resolver )',
                  'return $this->readiness->health( $this->writes_configured() )',
                  'return $this->readiness->require_read_ready()',
                  'return $this->readiness->require_write_ready( $requires_resolver, $this->writes_configured() )',
                  'private function resolve_reference_after_gate',
              ) as $required_service_marker ) {
                  if ( false === strpos( $service, $required_service_marker ) ) {
                      $fail( "Phase 23O service integration missing: {$required_service_marker}" );
                  }
              }
              if ( false !== strpos( $service, '$this->repository->health_check()' ) ) {
                  $fail( 'Phase 23O service retains a manual repository-health bypass.' );
              }
          } elseif ( $phase23o ) {
              $fail( 'Phase 23O evidence exists without the reviewed service integration.' );
          }
"""
          exact_replace(
              '.github/workflows/phase23n-collections-service-readiness-consumer.yml',
              """          if ( false !== strpos( $service, 'SPDB_Collections_Service_Readiness_Consumer' ) ) {
              $fail( 'Service-side consumer integration is not authorized in this foundation slice.' );
          }
""",
              phase23o_guard,
          )
          exact_replace(
              '.github/workflows/phase23n-corrective-snapshot-boundaries.yml',
              """          if ( false !== strpos( $service, 'SPDB_Collections_Service_Readiness_Consumer' ) ) {
              $fail( 'Service integration is not authorized in Phase 23N.' );
          }
""",
              phase23o_guard,
          )
          PY

      - name: Verify migrated evidence
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/phase23f-policy-tests.php
          php -l tests/phase23f-collections-ui-tests.php
          php -l tests/architecture-guard.php
          php tests/phase23f-policy-tests.php
          php tests/phase23f-collections-ui-tests.php
          php tests/architecture-guard.php
          grep -q 'spdb_collections_writes_disabled' tests/phase23f-policy-tests.php
          grep -q 'database_ready' tests/phase23f-collections-ui-tests.php
          grep -q 'Phase 23O service integration missing' .github/workflows/phase23n-collections-service-readiness-consumer.yml
          grep -q 'Phase 23O service integration missing' .github/workflows/phase23n-corrective-snapshot-boundaries.yml
          git diff --check

      - name: Remove one-shot workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase23o-migrate-retained-evidence.yml
          git rm .github/workflows/phase23o-migrate-retained-evidence-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/phase23f-policy-tests.php tests/phase23f-collections-ui-tests.php tests/architecture-guard.php \
            .github/workflows/phase23n-collections-service-readiness-consumer.yml \
            .github/workflows/phase23n-corrective-snapshot-boundaries.yml
          git commit -m 'Migrate retained evidence for reviewed Phase 23O integration'
          git push origin HEAD:phase/23o-collections-service-internal-consumption
