name: Phase 23N Corrective Snapshot Boundaries

on:
  push:
    branches: [main, 'phase/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase23n-corrective-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corrective-snapshot-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p qa-evidence
          printf 'expected_sha=%s\nactual_sha=%s\nrun_id=%s\nphp=%s\n' \
            "$EXPECTED_SHA" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "${{ matrix.php }}" \
            > "qa-evidence/phase23n-corrective-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify consolidated Phase 23N and Phase 23O files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            includes/class-spdb-collections-service-readiness-consumer.php
            includes/class-spdb-collections-service.php
            includes/class-spdb-plugin.php
            tests/phase23n-collections-service-readiness-consumer-tests.php
            tests/phase23n-consumer-adversarial-tests.php
            tests/phase23o-collections-service-internal-consumption-tests.php
            tests/architecture-guard.php
          )
          for file in "${required[@]}"; do test -s "$file" || exit 1; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            includes/class-spdb-collections-service-readiness-consumer.php \
            includes/class-spdb-collections-service.php \
            includes/class-spdb-plugin.php \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/phase23o-collections-service-internal-consumption-tests.php \
            tests/architecture-guard.php
          do php -l "$file"; done

      - name: Run Phase 23N and inherited readiness regressions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/phase23m-collections-service-probe-binding-tests.php \
            tests/phase23l-collections-repository-readiness-probe-tests.php \
            tests/phase23k-collections-service-readiness-integration-tests.php \
            tests/phase23j-collections-service-readiness-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            tests/phase23h-readiness-bridge-tests.php
          do
            php -d display_errors=1 -d error_reporting=E_ALL "$test_file" \
              | tee -a "qa-evidence/phase23n-corrective-tests-php-${{ matrix.php }}.log"
          done

      - name: Verify Phase 23O superseding integration
        shell: bash
        run: |
          set -euo pipefail
          php tests/phase23o-collections-service-internal-consumption-tests.php \
            | tee -a "qa-evidence/phase23n-corrective-tests-php-${{ matrix.php }}.log"
          php tests/architecture-guard.php \
            | tee -a "qa-evidence/phase23n-corrective-tests-php-${{ matrix.php }}.log"
          grep -Fq 'SPDB_Collections_Service_Readiness_Consumer::create' includes/class-spdb-collections-service.php
          grep -Fq 'new SPDB_Collections_Service( $this->collections_repository, $this->native_reference_registry )' includes/class-spdb-plugin.php
          ! grep -Eq 'register_rest_route\(|wp_insert_post\(|wp_update_post\(|wp_delete_post\(' includes/class-spdb-collections-service-readiness-consumer.php

      - name: Record exact-source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/phase23n-corrective-snapshot-boundaries.yml \
            includes/class-spdb-collections-service-readiness-consumer.php \
            includes/class-spdb-collections-service.php \
            includes/class-spdb-plugin.php \
            tests/phase23n-collections-service-readiness-consumer-tests.php \
            tests/phase23n-consumer-adversarial-tests.php \
            tests/phase23o-collections-service-internal-consumption-tests.php \
            tests/architecture-guard.php \
            > "qa-evidence/phase23n-corrective-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23N corrective QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23n-corrective-snapshot-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
