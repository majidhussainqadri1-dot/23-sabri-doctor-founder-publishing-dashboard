name: Phase 23G Native Reference Resolution

on:
  push:
    branches: [main, 'phase/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  native-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\nactual_sha=%s\nrun_id=%s\nphp=%s\n' "$EXPECTED_SHA" "$actual_sha" "$GITHUB_RUN_ID" "${{ matrix.php }}" > "qa-evidence/phase23g-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify resolver files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            includes/interface-spdb-native-reference-provider.php
            includes/interface-spdb-native-reference-resolver.php
            includes/interface-spdb-native-reference-readiness.php
            includes/class-spdb-native-reference-registry.php
            includes/class-spdb-native-reference-registry-readiness.php
            includes/class-spdb-native-reference-readiness-bridge.php
            includes/class-spdb-native-reference-registration.php
            includes/class-spdb-plugin.php
            tests/fixtures/class-test-native-reference-provider.php
            tests/phase23g-native-reference-tests.php
            tests/phase23g-native-reference-drift-tests.php
            tests/phase23h-readiness-bridge-tests.php
            tests/phase23i-registry-readiness-tests.php
          )
          for file in "${required[@]}"; do test -s "$file" || exit 1; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            includes/interface-spdb-native-reference-provider.php \
            includes/class-spdb-native-reference-registry.php \
            includes/class-spdb-native-reference-registry-readiness.php \
            includes/class-spdb-native-reference-readiness-bridge.php \
            includes/class-spdb-native-reference-registration.php \
            includes/class-spdb-plugin.php \
            tests/phase23g-native-reference-tests.php \
            tests/phase23g-native-reference-drift-tests.php \
            tests/phase23h-readiness-bridge-tests.php \
            tests/phase23i-registry-readiness-tests.php
          do php -l "$file"; done

      - name: Run resolver and readiness regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            tests/phase23g-native-reference-tests.php \
            tests/phase23g-native-reference-drift-tests.php \
            tests/phase23h-readiness-bridge-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            tests/phase23f-runtime-tests.php \
            tests/architecture-guard.php
          do
            php -d display_errors=1 -d error_reporting=E_ALL "$suite" \
              | tee -a "qa-evidence/phase23g-tests-php-${{ matrix.php }}.log"
          done

      - name: Verify retained resolver and integrated runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'interface SPDB_Native_Reference_Provider' includes/interface-spdb-native-reference-provider.php
          grep -Fq 'implements SPDB_Native_Reference_Resolver' includes/class-spdb-native-reference-registry.php
          grep -Fq 'ACCEPTANCE_UNREVIEWED' includes/class-spdb-native-reference-registry.php
          grep -Fq 'adapter_acceptance_state' includes/class-spdb-native-reference-registry.php
          grep -Fq 'validated_context' includes/class-spdb-native-reference-registry.php
          grep -Fq 'provider_contract_is_current' includes/class-spdb-native-reference-registry.php
          grep -Fq 'contract_drift' includes/class-spdb-native-reference-registry.php
          grep -Fq 'spdb/register_native_reference_resolvers' includes/class-spdb-native-reference-registration.php
          grep -Fq "apply_filters( 'spdb/native_reference_acceptance', array() )" includes/class-spdb-plugin.php
          grep -Fq "register_provider_adapters' ), 30" includes/class-spdb-plugin.php
          grep -Fq "register_native_reference_resolvers' ), 31" includes/class-spdb-plugin.php
          grep -Fq 'new SPDB_Collections_Service( $this->collections_repository, $this->native_reference_registry )' includes/class-spdb-plugin.php
          ! grep -Eq 'register_rest_route\s*\(|WP_REST_Server::(CREATABLE|EDITABLE|DELETABLE)' includes/class-spdb-native-reference-registry.php includes/class-spdb-native-reference-registration.php
          ! grep -Eq '\b(insert|update|delete)_?(option|post|metadata)?\s*\(' includes/class-spdb-native-reference-registry.php includes/class-spdb-native-reference-registration.php
          grep -Fq "'phase' => '23O'" includes/class-spdb-system-state.php

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            includes/interface-spdb-native-reference-provider.php \
            includes/class-spdb-native-reference-registry.php \
            includes/class-spdb-native-reference-registry-readiness.php \
            includes/class-spdb-native-reference-readiness-bridge.php \
            includes/class-spdb-native-reference-registration.php \
            includes/class-spdb-plugin.php \
            tests/phase23g-native-reference-tests.php \
            tests/phase23g-native-reference-drift-tests.php \
            tests/phase23h-readiness-bridge-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            > "qa-evidence/phase23g-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23G QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23g-native-reference-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
