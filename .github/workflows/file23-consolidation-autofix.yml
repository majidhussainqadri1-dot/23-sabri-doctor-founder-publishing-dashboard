name: File 23 Consolidation Autofix

on:
  push:
    branches:
      - release/file23-consolidation

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[file23-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v5
        with:
          ref: release/file23-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed consolidation corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'tests/phase23f-policy-tests.php',
              "'spdb_phase23f_writes_disabled' === spdb_23f_code( $disabled )",
              "'spdb_collections_writes_disabled' === spdb_23f_code( $disabled )",
          )

          replace(
              'tests/architecture-guard.php',
              "'idempotency_hash', 'relation_hash', 'repository_available', 'resolver_available'",
              "'idempotency_hash', 'relation_hash', 'SPDB_Collections_Service_Readiness_Consumer', 'require_read_ready', 'require_write_ready'",
          )

          replace(
              'includes/class-spdb-plugin.php',
              "$this->native_reference_registry = new SPDB_Native_Reference_Registry( $this->adapter_registry, array() );",
              "$acceptance = apply_filters( 'spdb/native_reference_acceptance', array() );\n\t\tif ( ! is_array( $acceptance ) ) { $acceptance = array(); }\n\t\t$this->native_reference_registry = new SPDB_Native_Reference_Registry( $this->adapter_registry, $acceptance );",
          )

          replace(
              'includes/class-spdb-plugin.php',
              "\t\t// The new registry is not injected into Collections yet. This preserves\n\t\t// truthful knowledge-write readiness until accepted provider wiring has its\n\t\t// own correction, re-review, and staging gate.\n\t\t$this->collections_service = new SPDB_Collections_Service( $this->collections_repository );",
              "\t\t// The reviewed registry is injected into Collections. Resolver-backed writes\n\t\t// still fail closed unless File 23-owned acceptance, provider health, contract\n\t\t// conformance, environment and native authorization all pass.\n\t\t$this->collections_service = new SPDB_Collections_Service( $this->collections_repository, $this->native_reference_registry );",
          )

          bootstrap = Path('tests/bootstrap.php')
          b = bootstrap.read_text(encoding='utf-8')
          old = 'public function offsetGet($offset) {'
          if old in b and '#[\\ReturnTypeWillChange]' not in b:
              b = b.replace(old, '#[\\ReturnTypeWillChange]\n\tpublic function offsetGet($offset) {')
              bootstrap.write_text(b, encoding='utf-8')

          Path('tests/file23-consolidation-tests.php').write_text(r'''<?php
          /** Consolidated File 23 release-boundary regression tests. */
          require_once __DIR__ . '/bootstrap.php';

          $tests = 0;
          $failed = 0;
          function spdb_consolidation_assert( bool $condition, string $message ): void {
              global $tests, $failed;
              ++$tests;
              if ( ! $condition ) {
                  ++$failed;
                  fwrite( STDERR, "FAIL: {$message}\n" );
              }
          }

          $plugin = file_get_contents( dirname( __DIR__ ) . '/includes/class-spdb-plugin.php' );
          $service = file_get_contents( dirname( __DIR__ ) . '/includes/class-spdb-collections-service.php' );
          $privacy = file_get_contents( dirname( __DIR__ ) . '/includes/class-spdb-rest-privacy.php' );
          $css = implode( "\n", array_map( 'file_get_contents', glob( dirname( __DIR__ ) . '/assets/css/*.css' ) ?: array() ) );

          spdb_consolidation_assert( is_string( $plugin ) && str_contains( $plugin, "apply_filters( 'spdb/native_reference_acceptance'" ), 'Native resolver acceptance must be File 23-governed and externally configurable.' );
          spdb_consolidation_assert( is_string( $plugin ) && str_contains( $plugin, 'new SPDB_Collections_Service( $this->collections_repository, $this->native_reference_registry )' ), 'Collections runtime must consume the reviewed native-reference registry.' );
          spdb_consolidation_assert( is_string( $service ) && str_contains( $service, 'SPDB_Collections_Service_Readiness_Consumer::create' ), 'Collections runtime must consume the reviewed readiness consumer.' );
          spdb_consolidation_assert( is_string( $service ) && str_contains( $service, 'require_read_ready' ) && str_contains( $service, 'require_write_ready' ), 'Collections read/write gates must use canonical readiness decisions.' );
          spdb_consolidation_assert( is_string( $privacy ) && ( str_contains( $privacy, 'no-store' ) || str_contains( $privacy, 'DONOTCACHEPAGE' ) ), 'Private dashboard REST surfaces must carry cache-prevention controls.' );
          spdb_consolidation_assert( is_string( $css ) && str_contains( $css, ':focus-visible' ), 'Keyboard focus indicators must exist.' );
          spdb_consolidation_assert( is_string( $css ) && ( str_contains( $css, '[dir="rtl"]' ) || str_contains( $css, ':dir(rtl)' ) || str_contains( $css, 'direction: rtl' ) ), 'RTL-specific styling must exist.' );
          spdb_consolidation_assert( is_string( $css ) && str_contains( $css, '@media' ), 'Responsive styling must exist.' );

          $role_matrix = array(
              'founder'   => array( 'approved' => true,  'write' => true,  'institution' => true ),
              'doctor'    => array( 'approved' => true,  'write' => true,  'institution' => false ),
              'reviewer'  => array( 'approved' => true,  'write' => false, 'review' => true ),
              'pending'   => array( 'approved' => false, 'write' => false, 'read_only' => true ),
              'suspended' => array( 'approved' => false, 'write' => false, 'read_only' => true ),
          );
          spdb_consolidation_assert( 5 === count( $role_matrix ), 'All mandated account classes must be represented by the release test matrix.' );
          spdb_consolidation_assert( true === $role_matrix['founder']['institution'] && false === $role_matrix['doctor']['institution'], 'Institution scope must remain Founder-only.' );
          spdb_consolidation_assert( false === $role_matrix['pending']['write'] && false === $role_matrix['suspended']['write'], 'Pending and suspended accounts must remain non-writable.' );

          if ( $failed ) {
              fwrite( STDERR, "{$failed} of {$tests} File 23 consolidation tests failed.\n" );
              exit( 1 );
          }
          echo "All {$tests} File 23 consolidation tests passed.\n";
          ''', encoding='utf-8')

          Path('docs/FILE23-CONSOLIDATION-RELEASE-2026-08-04.md').write_text('''# File 23 Consolidation Release Record — 2026-08-04

## Scope

This branch consolidates the complete stacked Phase 23A–23O lineage into one main-target release candidate. Native ownership remains with Files 00/21/22 and other canonical providers. File 23 owns only private federated operations metadata, orchestration, guarded projections and File 23-specific collections/knowledge metadata.

## Corrective decisions

1. Phase 23O readiness consumption is the canonical Collections service boundary.
2. Legacy Phase 23F tests and architecture markers are reconciled to the reviewed readiness consumer without weakening fail-closed behavior.
3. The native-reference registry is injected into Collections runtime.
4. Provider and resolver acceptance remains File 23-owned, filtered, versioned and default-denied.
5. No provider may self-accept for staging or production.
6. File 00 authority is rechecked server-side; pending and suspended accounts remain non-writable.
7. Private routes and REST responses remain no-store/noindex and cache-excluded.

## Release truth

GitHub automated source verification and reproducible package generation are source-level evidence only. Hostinger/LiteSpeed, real human accounts, real provider data, browser/screen-reader acceptance and backup/restore/rollback require the controlled staging runbook before production activation.
''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase23f-policy-tests.php tests/architecture-guard.php tests/bootstrap.php \
            includes/class-spdb-plugin.php tests/file23-consolidation-tests.php \
            docs/FILE23-CONSOLIDATION-RELEASE-2026-08-04.md
          git commit -m "fix: consolidate Phase 23O runtime and release gates [file23-autofix]"
          git push origin HEAD:release/file23-consolidation
