name: File 23 Release Version Sync

on:
  push:
    branches: [release/file23-consolidation]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/file23-consolidation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile current release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('tests/bootstrap.php'),
              Path('templates/dashboard.php'),
              Path('README.md'),
              Path('STATUS.md'),
              Path('CHANGELOG.md'),
          ]
          targets.extend(Path('.github/workflows').glob('*.yml'))
          for path in targets:
              if not path.exists() or path.name == 'file23-release-version-sync.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('0.7.0', '1.0.0')
              if path == Path('templates/dashboard.php'):
                  updated = updated.replace('Phase 23G', 'Phase 23O')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bootstrap.php templates/dashboard.php README.md STATUS.md CHANGELOG.md .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: reconcile File 23 1.0.0 identity [release-sync]"
          git push origin HEAD:release/file23-consolidation
