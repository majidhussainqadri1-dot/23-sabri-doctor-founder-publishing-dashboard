name: File 23 Three-Plan Harmonization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file23-three-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harmonization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify syntax
        shell: bash
        run: |
          set -euo pipefail
          find includes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/dashboard.js
          node --check assets/js/operations.js

      - name: Three-plan source gate
        run: php tests/three-plan-harmonization-tests.php

      - name: Historical ten-round gate
        run: php tests/ten-round-corrective-review-tests.php

      - name: Operational projection gate
        run: php tests/operational-validator-tests.php

      - name: Operational mutation gate
        run: php tests/operational-mutation-guard-tests.php

      - name: Provider registration gate
        run: php tests/provider-registration-tests.php

      - name: Native reference gate
        run: php tests/phase23g-native-reference-tests.php

      - name: Architecture guard
        run: php tests/architecture-guard.php

      - name: Consolidation guard
        run: php tests/file23-consolidation-tests.php
