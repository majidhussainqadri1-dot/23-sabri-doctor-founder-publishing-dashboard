name: File 23 Three-Plan Harmonization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file23-three-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harmonization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Syntax — runtime bootstrap and manifest
        run: |
          php -l sabri-publishing-dashboard.php
          php -l includes/class-spdb-module-manifest.php

      - name: Syntax — authorization and automation
        run: |
          php -l includes/class-spdb-capabilities.php
          php -l includes/class-spdb-automation-engine.php

      - name: Syntax — corrected review gates
        run: |
          php -l tests/bootstrap.php
          php -l tests/ten-round-corrective-review-tests.php
          php -l tests/second-ten-round-review-tests.php
          php -l tests/final-deliverables-tests.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/dashboard.js
          node --check assets/js/operations.js

      - name: Three-plan source gate
        run: php tests/three-plan-harmonization-tests.php

      - name: Historical ten-round gate
        run: php tests/ten-round-corrective-review-tests.php

      - name: Current ten-round gate
        run: php tests/second-ten-round-review-tests.php

      - name: Operational projection gate
        run: php tests/operational-validator-tests.php

      - name: Operational mutation gate
        run: php tests/operational-mutation-guard-tests.php

      - name: Provider registration gate
        run: php tests/provider-registration-tests.php

      - name: Native reference gate
        run: php tests/phase23g-native-reference-tests.php

      - name: Architecture guard
        run: php tests/architecture-guard.php

      - name: Consolidation guard
        run: php tests/file23-consolidation-tests.php
