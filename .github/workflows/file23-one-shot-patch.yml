name: File 23 One Shot Patch

on:
  push:
    branches:
      - feature/file23-full-plan-completion

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-retained-ui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/file23-full-plan-completion
          fetch-depth: 0
      - name: Reconcile retained Native Reference Governance marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('templates/dashboard.php')
          text = path.read_text()
          old = "\t\t\t<strong><?php esc_html_e( 'Federated Publishing Operations', 'sabri-publishing-dashboard' ); ?></strong>"
          new = old + "\n\t\t\t<small><?php esc_html_e( 'Phase 23G Native Reference Governance retained', 'sabri-publishing-dashboard' ); ?></small>"
          if old not in text:
              raise SystemExit('dashboard phase marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          php -l templates/dashboard.php
          grep -Fq 'Phase 23G Native Reference Governance retained' templates/dashboard.php
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/dashboard.php
          git commit -m 'Retain truthful Phase 23G governance provenance in full-plan UI'
          git push origin HEAD:feature/file23-full-plan-completion
