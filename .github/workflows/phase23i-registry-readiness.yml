name: Phase 23I Registry Readiness Conformance

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  registry-readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checked head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\nactual_sha=%s\nrun_id=%s\nphp=%s\n' "$EXPECTED_SHA" "$actual_sha" "$GITHUB_RUN_ID" "${{ matrix.php }}" > "qa-evidence/phase23i-context-php-${{ matrix.php }}.txt"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify Phase 23I files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .github/workflows/phase23i-registry-readiness.yml
            docs/AUDIT-PHASE-23I-REGISTRY-READINESS-CONFORMANCE-2026-07-31.md
            includes/interface-spdb-native-reference-readiness.php
            includes/class-spdb-native-reference-readiness-bridge.php
            includes/class-spdb-native-reference-registry.php
            includes/class-spdb-native-reference-registry-readiness.php
            tests/phase23h-readiness-bridge-tests.php
            tests/phase23i-registry-readiness-tests.php
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/interface-spdb-native-reference-readiness.php
          php -l includes/class-spdb-native-reference-readiness-bridge.php
          php -l includes/class-spdb-native-reference-registry.php
          php -l includes/class-spdb-native-reference-registry-readiness.php
          php -l tests/phase23h-readiness-bridge-tests.php
          php -l tests/phase23i-registry-readiness-tests.php

      - name: Run corrective Phase 23I registry readiness tests
        shell: bash
        run: set -o pipefail; php tests/phase23i-registry-readiness-tests.php | tee "qa-evidence/phase23i-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23H bridge regression
        shell: bash
        run: set -o pipefail; php tests/phase23h-readiness-bridge-tests.php | tee -a "qa-evidence/phase23i-tests-php-${{ matrix.php }}.log"

      - name: Run Phase 23G drift regression
        shell: bash
        run: set -o pipefail; php tests/phase23g-native-reference-drift-tests.php | tee -a "qa-evidence/phase23i-tests-php-${{ matrix.php }}.log"

      - name: Run architecture guard
        shell: bash
        run: set -o pipefail; php tests/architecture-guard.php | tee -a "qa-evidence/phase23i-tests-php-${{ matrix.php }}.log"

      - name: Verify bounded conformance and no runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'implements SPDB_Native_Reference_Readiness' includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'private function __construct' includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'from_registry' includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'from_health_reader_for_tests' includes/class-spdb-native-reference-registry-readiness.php
          grep -q "defined( 'SPDB_TESTING' )" includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'valid_provider_health' includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'registry_health_invalid' includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'registry_health_exception' includes/class-spdb-native-reference-registry-readiness.php
          grep -q 'no_ready_provider' includes/class-spdb-native-reference-registry-readiness.php
          ! grep -q 'class-spdb-native-reference-registry-readiness.php' includes/class-spdb-plugin.php
          ! grep -Eq 'register_rest_route\s*\(|WP_REST_Server::(CREATABLE|EDITABLE|DELETABLE)|\b(?:POST|PUT|PATCH|DELETE)\b' includes/class-spdb-native-reference-registry-readiness.php
          ! grep -Eq '\b(?:insert|update|delete)_?(?:option|post|metadata)?\s*\(' includes/class-spdb-native-reference-registry-readiness.php
          grep -qi 'Corrective Review Findings' docs/AUDIT-PHASE-23I-REGISTRY-READINESS-CONFORMANCE-2026-07-31.md
          grep -qi 'DO NOT MERGE' docs/AUDIT-PHASE-23I-REGISTRY-READINESS-CONFORMANCE-2026-07-31.md

      - name: Record source checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/phase23i-registry-readiness.yml \
            includes/interface-spdb-native-reference-readiness.php \
            includes/class-spdb-native-reference-readiness-bridge.php \
            includes/class-spdb-native-reference-registry.php \
            includes/class-spdb-native-reference-registry-readiness.php \
            tests/phase23h-readiness-bridge-tests.php \
            tests/phase23i-registry-readiness-tests.php \
            docs/AUDIT-PHASE-23I-REGISTRY-READINESS-CONFORMANCE-2026-07-31.md \
            > "qa-evidence/phase23i-checksums-php-${{ matrix.php }}.sha256"

      - name: Upload Phase 23I QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-23i-registry-readiness-qa-php-${{ matrix.php }}-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
