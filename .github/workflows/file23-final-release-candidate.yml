name: File 23 Final Release Candidate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FILE00_SHA: 1831c7ed767ce8590a97dc8e2f2d38ad81661494
  FILE21_SHA: e1bbfb514b859a51b9731a43d6a15fb824124507
  FILE22_SHA: 1274e380268c2ab235c66fd21906cf4b1bcadf9a

jobs:
  guard-normalization:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/file23-full-plan-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/file23-full-plan-completion
          fetch-depth: 0
      - name: Normalize architecture schema path matching
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '$relative_normalized' tests/architecture-guard.php; then
            echo 'Architecture guard already normalized.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/architecture-guard.php')
          text = path.read_text()
          old = "\t$path     = $file->getPathname();\n\t$relative = ltrim( str_replace( $root, '', $path ), DIRECTORY_SEPARATOR );\n\tif ( str_starts_with( $relative, 'tests' . DIRECTORY_SEPARATOR ) || str_starts_with( $relative, 'vendor' . DIRECTORY_SEPARATOR ) ) {"
          new = "\t$path                = $file->getPathname();\n\t$relative            = ltrim( str_replace( $root, '', $path ), DIRECTORY_SEPARATOR );\n\t$relative_normalized = str_replace( DIRECTORY_SEPARATOR, '/', $relative );\n\tif ( str_starts_with( $relative_normalized, 'tests/' ) || str_starts_with( $relative_normalized, 'vendor/' ) ) {"
          if old not in text:
              raise SystemExit('relative path block not found')
          text = text.replace(old, new, 1)
          text = text.replace("if ( ! in_array( $relative, $broker_execution_files, true )", "if ( ! in_array( $relative_normalized, array_map( static fn( string $candidate ): string => str_replace( DIRECTORY_SEPARATOR, '/', $candidate ), $broker_execution_files ), true )", 1)
          text = text.replace("$is_allowed_schema = in_array( $relative, $allowed_schema_files, true );", "$normalized_allowed_schema_files = array_map( static fn( string $candidate ): string => str_replace( DIRECTORY_SEPARATOR, '/', $candidate ), $allowed_schema_files );\n\t$is_allowed_schema = in_array( $relative_normalized, $normalized_allowed_schema_files, true )\n\t\t|| str_ends_with( $relative_normalized, '/class-spdb-collections-schema.php' )\n\t\t|| str_ends_with( $relative_normalized, '/class-spdb-operations-schema.php' );", 1)
          path.write_text(text)
          PY
          php -l tests/architecture-guard.php
          php tests/architecture-guard.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/architecture-guard.php
          git commit -m 'Normalize architecture guard schema path matching'
          git push origin HEAD:feature/file23-full-plan-completion

  real-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: file23
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          ref: ${{ env.FILE00_SHA }}
          path: file00
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: majidhussainqadri1-dot/sabri-complete-home-news-feed
          ref: ${{ env.FILE21_SHA }}
          path: file21
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: majidhussainqadri1-dot/sabri-universal-post-composer
          ref: ${{ env.FILE22_SHA }}
          path: file22
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify exact pins and File 00 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file00 rev-parse HEAD)" = "$FILE00_SHA"
          test "$(git -C file21 rev-parse HEAD)" = "$FILE21_SHA"
          test "$(git -C file22 rev-parse HEAD)" = "$FILE22_SHA"
          php -l file00/source/sabri-membership-core/includes/class-smc-contracts.php
          grep -Fq 'SMC_Contracts::assertions( $user_id )' file23/includes/class-spdb-membership-guard.php
          grep -Fq "MINIMUM_CONTRACT_VERSION  = '1.1.2'" file23/includes/class-spdb-membership-guard.php
      - name: Prepare current File 22 autoload boundary
        shell: bash
        run: |
          cat > file22-autoload.php <<'PHP'
          <?php
          $root = getenv( 'FILE22_ROOT' );
          spl_autoload_register(
              static function ( string $class ) use ( $root ): void {
                  $prefix = 'Sabri\\UniversalComposer\\';
                  if ( ! str_starts_with( $class, $prefix ) ) { return; }
                  $relative = substr( $class, strlen( $prefix ) );
                  $parts = explode( '\\', $relative );
                  $area = strtolower( array_shift( $parts ) ?? '' );
                  $name = array_pop( $parts );
                  if ( ! in_array( $area, array( 'core', 'contracts' ), true ) || ! is_string( $name ) ) { return; }
                  $slug = strtolower( str_replace( '_', '-', $name ) );
                  $kind = 'contracts' === $area && str_starts_with( $name, 'Workflow_' ) ? 'interface-' : 'class-';
                  $file = rtrim( (string) $root, '/\\' ) . '/includes/' . $area . '/' . $kind . $slug . '.php';
                  if ( is_file( $file ) ) { require_once $file; }
              }
          );
          PHP
      - name: Run real File 21 and File 22 contracts
        shell: bash
        env:
          FILE22_ROOT: ${{ github.workspace }}/file22
        run: |
          set -euo pipefail
          php -d auto_prepend_file="${{ github.workspace }}/file22-autoload.php" file21/tests/run-file21-file22-real-contract-tests.php
          php file21/tests/run-file21-file22-workflow-adapter-tests.php
          php file21/tests/run-file21-file22-maintenance-tests.php
          php file21/tests/run-file21-file22-lock-maintenance-tests.php
      - name: Run all File 23 source regressions
        shell: bash
        working-directory: file23
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/dashboard.js
          node --check assets/js/operations.js
          for suite in tests/*-tests.php; do php -d display_errors=1 -d error_reporting=E_ALL "$suite"; done
          php tests/architecture-guard.php
      - name: Verify accessibility and private-cache boundaries
        shell: bash
        working-directory: file23
        run: |
          set -euo pipefail
          grep -R -Fq 'DONOTCACHEPAGE' includes tests
          grep -R -Fq 'private, no-store' includes tests
          grep -R -Fq ':focus-visible' assets/css
          grep -R -Eq '\[dir="rtl"\]|:dir\(rtl\)|direction:[[:space:]]*rtl' assets/css
          grep -R -Fq 'prefers-reduced-motion' assets/css
          grep -R -Fq 'forced-colors' assets/css

  canonical-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: real-contracts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run release-critical regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/full-plan-completion-tests.php
          php tests/full-plan-security-adversarial-tests.php
          php tests/operational-validator-tests.php
          php tests/legacy-migration-diagnostics-tests.php
          php tests/architecture-guard.php
          test -s docs/STAGING-BACKUP-RESTORE-MIGRATION-ROLLBACK-RUNBOOK.md
      - name: Build deterministic 1.1.0 package
        run: bash tools/build-final-release.sh
      - name: Record exact release evidence
        shell: bash
        run: |
          printf 'file23_head=%s\nfile00=%s\nfile21=%s\nfile22=%s\nversion=1.1.0\n' \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" \
            "$FILE00_SHA" "$FILE21_SHA" "$FILE22_SHA" > FILE23-1.1.0-RELEASE-EVIDENCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: file23-1.1.0-canonical-installable
          path: |
            23-sabri-doctor-founder-publishing-dashboard-1.1.0.zip
            23-sabri-doctor-founder-publishing-dashboard-1.1.0.zip.sha256
            FILE23-1.1.0-MANIFEST.sha256
            FILE23-1.1.0-RELEASE-EVIDENCE.txt
            docs/STAGING-BACKUP-RESTORE-MIGRATION-ROLLBACK-RUNBOOK.md
          if-no-files-found: error
          retention-days: 90
