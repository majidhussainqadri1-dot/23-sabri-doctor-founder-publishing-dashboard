name: File 23 Final Release Candidate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FILE00_SHA: 1831c7ed767ce8590a97dc8e2f2d38ad81661494
  FILE21_SHA: e1bbfb514b859a51b9731a43d6a15fb824124507
  FILE22_SHA: 1274e380268c2ab235c66fd21906cf4b1bcadf9a

jobs:
  materialize-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.materialize.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - id: materialize
        name: Materialize reviewed Version 1.2.0 source when transfer is present
        shell: bash
        run: |
          set -euo pipefail
          transfer_dir='.file23-transfer/chunks'
          if [ ! -d "$transfer_dir" ] || ! compgen -G "$transfer_dir/part-*" > /dev/null; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat \
            "$transfer_dir/part-00" \
            "$transfer_dir/part-01" \
            "$transfer_dir/part-02" \
            "$transfer_dir/part-03" \
            "$transfer_dir/part-04" \
            "$transfer_dir/part-05" \
            "$transfer_dir/part-06" \
            "$transfer_dir/part-07" \
            "$transfer_dir/part-08-09" \
            "$transfer_dir/part-10" \
            "$transfer_dir/part-11" \
            "$transfer_dir/part-12" \
            "$transfer_dir/part-13" \
            "$transfer_dir/part-14" \
            "$transfer_dir/part-15" \
            > /tmp/file23-1.2.0.patch.bz2.b64
          base64 -d /tmp/file23-1.2.0.patch.bz2.b64 > /tmp/file23-1.2.0.patch.bz2
          test "$(sha256sum /tmp/file23-1.2.0.patch.bz2 | awk '{print $1}')" = 'c7d6bfa458ea7928d21312551a16aedf3c3748576afcf7d8b8e9512e6735e199'
          bunzip2 -c /tmp/file23-1.2.0.patch.bz2 > /tmp/file23-full.patch
          awk '
            /^diff -ruN .*a\/\.github\/workflows\/file23-final-release-candidate\.yml b\/\.github\/workflows\/file23-final-release-candidate\.yml$/ { skip=1; next }
            /^diff -ruN / { if (skip) skip=0 }
            !skip { print }
          ' /tmp/file23-full.patch > /tmp/file23-apply.patch
          patch -p1 --batch --forward < /tmp/file23-apply.patch
          rm -rf .file23-transfer
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/dashboard.js
          node --check assets/js/operations.js
          for suite in tests/*-tests.php; do php -d display_errors=1 -d error_reporting=E_ALL "$suite"; done
          php tests/architecture-guard.php
          mkdir -p .file23-workflow-transfer
          cp .github/workflows/baseline-integrity.yml .file23-workflow-transfer/baseline-integrity.yml
          cp .github/workflows/file23-full-plan-completion.yml .file23-workflow-transfer/file23-full-plan-completion.yml
          git checkout -- .github/workflows/baseline-integrity.yml .github/workflows/file23-full-plan-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'Complete File 23 forty-round review and hardening'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  real-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: materialize-reviewed-source
    if: needs.materialize-reviewed-source.outputs.changed != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: file23
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          ref: ${{ env.FILE00_SHA }}
          path: file00
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: majidhussainqadri1-dot/sabri-complete-home-news-feed
          ref: ${{ env.FILE21_SHA }}
          path: file21
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: majidhussainqadri1-dot/sabri-universal-post-composer
          ref: ${{ env.FILE22_SHA }}
          path: file22
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify exact pins and File 00 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file00 rev-parse HEAD)" = "$FILE00_SHA"
          test "$(git -C file21 rev-parse HEAD)" = "$FILE21_SHA"
          test "$(git -C file22 rev-parse HEAD)" = "$FILE22_SHA"
          php -l file00/source/sabri-membership-core/includes/class-smc-contracts.php
          grep -Fq 'SMC_Contracts::assertions( $user_id )' file23/includes/class-spdb-membership-guard.php
          grep -Fq "MINIMUM_CONTRACT_VERSION  = '1.1.2'" file23/includes/class-spdb-membership-guard.php
      - name: Prepare current File 22 autoload boundary
        shell: bash
        run: |
          cat > file22-autoload.php <<'PHP'
          <?php
          $root = getenv( 'FILE22_ROOT' );
          spl_autoload_register(
              static function ( string $class ) use ( $root ): void {
                  $prefix = 'Sabri\\UniversalComposer\\';
                  if ( ! str_starts_with( $class, $prefix ) ) { return; }
                  $relative = substr( $class, strlen( $prefix ) );
                  $parts = explode( '\\', $relative );
                  $area = strtolower( array_shift( $parts ) ?? '' );
                  $name = array_pop( $parts );
                  if ( ! in_array( $area, array( 'core', 'contracts' ), true ) || ! is_string( $name ) ) { return; }
                  $slug = strtolower( str_replace( '_', '-', $name ) );
                  $kind = 'contracts' === $area && str_starts_with( $name, 'Workflow_' ) ? 'interface-' : 'class-';
                  $file = rtrim( (string) $root, '/\\' ) . '/includes/' . $area . '/' . $kind . $slug . '.php';
                  if ( is_file( $file ) ) { require_once $file; }
              }
          );
          PHP
      - name: Run real File 21 and File 22 contracts
        shell: bash
        env:
          FILE22_ROOT: ${{ github.workspace }}/file22
        run: |
          set -euo pipefail
          php -d auto_prepend_file="${{ github.workspace }}/file22-autoload.php" file21/tests/run-file21-file22-real-contract-tests.php
          php file21/tests/run-file21-file22-workflow-adapter-tests.php
          php file21/tests/run-file21-file22-maintenance-tests.php
          php file21/tests/run-file21-file22-lock-maintenance-tests.php
      - name: Run all File 23 source regressions
        shell: bash
        working-directory: file23
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/dashboard.js
          node --check assets/js/operations.js
          for suite in tests/*-tests.php; do php -d display_errors=1 -d error_reporting=E_ALL "$suite"; done
          php tests/architecture-guard.php
      - name: Verify accessibility and private-cache boundaries
        shell: bash
        working-directory: file23
        run: |
          set -euo pipefail
          grep -R -Fq 'DONOTCACHEPAGE' includes tests
          grep -R -Fq 'private, no-store' includes tests
          grep -R -Fq ':focus-visible' assets/css
          grep -R -Eq '\[dir="rtl"\]|:dir\(rtl\)|direction:[[:space:]]*rtl' assets/css
          grep -R -Fq 'prefers-reduced-motion' assets/css
          grep -R -Fq 'forced-colors' assets/css

  canonical-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: real-contracts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run release-critical regressions and final-deliverables gate
        shell: bash
        run: |
          set -euo pipefail
          php tests/full-plan-completion-tests.php
          php tests/full-plan-security-adversarial-tests.php
          php tests/operational-validator-tests.php
          php tests/legacy-migration-diagnostics-tests.php
          php tests/final-deliverables-tests.php
          php tests/forty-round-review-gate-tests.php
          php tests/architecture-guard.php
          test -s docs/STAGING-BACKUP-RESTORE-MIGRATION-ROLLBACK-RUNBOOK.md
          test -s docs/CAPABILITY-MATRIX.md
          test -s docs/DATABASE-SCHEMA-MANIFEST.md
          test -s docs/DATA-OWNERSHIP-MATRIX.md
          test -s docs/THREAT-MODEL.md
          test -s docs/STAGING-CHECKLIST.md
          test -s docs/TEST-REPORT.md
          test -s docs/KNOWN-LIMITATIONS.md
          test -s docs/RELEASE-SIGNOFF.md
          test -s docs/AUDIT-40-ROUND-REVIEW-AND-CORRECTIONS-2026-08-04.md
      - name: Build deterministic installable and complete-source packages
        run: bash tools/build-final-release.sh
      - name: Record exact release evidence
        shell: bash
        run: |
          printf 'file23_head=%s\nfile00=%s\nfile21=%s\nfile22=%s\nversion=1.2.0\n' \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" \
            "$FILE00_SHA" "$FILE21_SHA" "$FILE22_SHA" > FILE23-1.2.0-RELEASE-EVIDENCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: file23-1.2.0-canonical-release-evidence
          path: |
            23-sabri-doctor-founder-publishing-dashboard-1.2.0.zip
            23-sabri-doctor-founder-publishing-dashboard-1.2.0.zip.sha256
            FILE23-1.2.0-MANIFEST.sha256
            23-Doctor-Founder-Publishing-Dashboard-Source-1.2.0.zip
            23-Doctor-Founder-Publishing-Dashboard-Source-1.2.0.zip.sha256
            FILE23-1.2.0-SOURCE-MANIFEST.sha256
            FILE23-1.2.0-RELEASE-EVIDENCE.txt
            docs/STAGING-CHECKLIST.md
            docs/RELEASE-SIGNOFF.md
            docs/KNOWN-LIMITATIONS.md
            docs/TEST-REPORT.md
            docs/AUDIT-40-ROUND-REVIEW-AND-CORRECTIONS-2026-08-04.md
          if-no-files-found: error
          retention-days: 90
